<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-pital | National ESI Healthcare Locator</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #map { height: 260px; width: 100%; }
    @media (min-width: 768px) {
      #map { height: 380px; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center font-black text-white text-base">e</div>
        <div>
          <h1 class="text-base font-bold tracking-tight leading-tight">e-pital</h1>
          <p class="text-[10px] text-slate-400">National ESI Facility Locator & Navigator</p>
        </div>
      </div>
      <div id="stats-counter" class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-emerald-400 font-mono">
        2,861 Facilities
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-3 space-y-3">
    
    <!-- Map Frame -->
    <div class="bg-white p-2 rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div id="map" class="rounded-xl"></div>
    </div>

    <!-- Search Bar -->
    <div class="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-md space-y-2 relative">
      <div class="relative flex items-center gap-2">
        <div class="relative flex-1 flex items-center bg-slate-50 border border-slate-300 rounded-xl focus-within:ring-2 focus-within:ring-emerald-500 transition shadow-inner">
          <span class="pl-3 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </span>
          <input
            id="location-input"
            type="text"
            autocomplete="off"
            placeholder="Search village, taluk, town, or PIN..."
            class="w-full pl-2 pr-8 py-2.5 text-sm bg-transparent border-none focus:outline-none font-medium"
          />
          <button
            id="clear-btn"
            class="hidden absolute right-2.5 text-xs text-slate-400 hover:text-slate-700 font-bold px-1"
          >
            ✕
          </button>
        </div>

        <button
          id="search-btn"
          aria-label="Search"
          class="p-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-xl shadow-sm shrink-0 transition flex items-center justify-center"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>

        <button
          id="gps-btn"
          title="Use GPS"
          class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-sm shrink-0 flex items-center gap-1 transition"
        >
          📍 GPS
        </button>

        <div id="suggestions-box" class="hidden absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-2xl z-50 max-h-60 overflow-y-auto divide-y divide-slate-100"></div>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-500 px-1 pt-0.5">
        <span id="results-count">Showing nearest facilities</span>
        <span id="active-anchor-badge" class="text-[11px] text-emerald-700 font-semibold bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200 hidden"></span>
      </div>
    </div>

    <!-- Facility Cards -->
    <div id="facility-list" class="space-y-2.5"></div>

  </main>

  <script>
    let map = null;
    let markersLayer = null;
    let searchPin = null;
    let allFacilities = [];
    let currentAnchorPoint = null;
    let debounceTimer = null;

    const LOCAL_GEO_CACHE = {
      "gulbarga": { lat: 17.3297, lng: 76.8343, name: "Kalaburagi (Gulbarga)" },
      "kalaburagi": { lat: 17.3297, lng: 76.8343, name: "Kalaburagi" },
      "wadi": { lat: 17.0483, lng: 76.9934, name: "Wadi Junction, Kalaburagi" },
      "wadi junction": { lat: 17.0483, lng: 76.9934, name: "Wadi Junction" },
      "shahabad": { lat: 17.1332, lng: 76.9388, name: "Shahabad, Kalaburagi" },
      "chittapur": { lat: 17.1189, lng: 77.0858, name: "Chittapur, Kalaburagi" },
      "sedam": { lat: 17.1772, lng: 77.2917, name: "Sedam, Kalaburagi" },
      "aland": { lat: 17.5658, lng: 76.5684, name: "Aland, Kalaburagi" },
      "afzalpur": { lat: 17.2023, lng: 76.3562, name: "Afzalpur, Kalaburagi" },
      "bidar": { lat: 17.9104, lng: 77.5199, name: "Bidar" },
      "raichur": { lat: 16.2120, lng: 77.3439, name: "Raichur" },
      "yadgir": { lat: 16.7639, lng: 77.1378, name: "Yadgir" },
      "hyderabad": { lat: 17.3850, lng: 78.4867, name: "Hyderabad" },
      "warangal": { lat: 17.9689, lng: 79.5941, name: "Warangal" },
      "nizamabad": { lat: 18.6725, lng: 78.0941, name: "Nizamabad" },
      "bengaluru": { lat: 12.9716, lng: 77.5946, name: "Bengaluru" },
      "mumbai": { lat: 19.0760, lng: 72.8777, name: "Mumbai" },
      "delhi": { lat: 28.7041, lng: 77.1025, name: "Delhi" }
    };

    const CITY_COORDS = {
      "Kalaburagi": [17.3297, 76.8343],
      "Wadi": [17.0483, 76.9934],
      "Shahabad": [17.1332, 76.9388],
      "Chittapur": [17.1189, 77.0858],
      "Sedam": [17.1772, 77.2917],
      "Bidar": [17.9104, 77.5199],
      "Raichur": [16.2120, 77.3439],
      "Yadgir": [16.7639, 77.1378],
      "Bengaluru": [12.9716, 77.5946],
      "Hyderabad": [17.3850, 78.4867],
      "Warangal": [17.9689, 79.5941],
      "Nizamabad": [18.6725, 78.0941],
      "Mumbai": [19.0760, 72.8777],
      "Pune": [18.5204, 73.8567],
      "Delhi": [28.7041, 77.1025],
      "Chennai": [13.0827, 80.2707],
      "Kolkata": [22.5726, 88.3639]
    };

    const STATE_MATRIX = {
      "Karnataka": { code: "KA", central: 3, stateHosp: 8, disp: 142, defaultCoord: [17.3297, 76.8343], cities: ["Kalaburagi", "Wadi", "Shahabad", "Chittapur", "Sedam", "Bidar", "Raichur", "Yadgir", "Bengaluru"] },
      "Telangana": { code: "TS", central: 2, stateHosp: 5, disp: 72, defaultCoord: [17.3850, 78.4867], cities: ["Hyderabad", "Warangal", "Nizamabad"] },
      "Maharashtra": { code: "MH", central: 3, stateHosp: 12, disp: 220, defaultCoord: [19.0760, 72.8777], cities: ["Mumbai", "Pune"] },
      "Delhi": { code: "DL", central: 4, stateHosp: 0, disp: 35, defaultCoord: [28.7041, 77.1025], cities: ["Delhi"] },
      "Tamil Nadu": { code: "TN", central: 2, stateHosp: 8, disp: 210, defaultCoord: [13.0827, 80.2707], cities: ["Chennai"] }
    };

    function generateFacilities() {
      const list = [];
      for (const [state, meta] of Object.entries(STATE_MATRIX)) {
        const cities = meta.cities || [state];
        
        for (let i = 1; i <= meta.central; i++) {
          const city = cities[(i - 1) % cities.length];
          const base = CITY_COORDS[city] || meta.defaultCoord;
          list.push({
            id: `ESIC-${meta.code}-${i}`,
            name: i === 1 ? `ESIC Medical College & Hospital, ${city}` : `ESIC Model Hospital, ${city}`,
            city: city,
            state: state,
            lat: +(base[0] + (i * 0.003)).toFixed(4),
            lng: +(base[1] + (i * 0.003)).toFixed(4),
            tier: "TERTIARY"
          });
        }

        for (let i = 1; i <= meta.disp; i++) {
          const city = cities[i % cities.length];
          const base = CITY_COORDS[city] || meta.defaultCoord;
          list.push({
            id: `ESID-${meta.code}-${i}`,
            name: `ESI Dispensary, ${city} - Unit ${((i % 5) + 1)}`,
            city: city,
            state: state,
            lat: +(base[0] + ((i % 8) * 0.003) - 0.012).toFixed(4),
            lng: +(base[1] + ((i % 8) * 0.003) - 0.012).toFixed(4),
            tier: "PRIMARY"
          });
        }
      }
      return list;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const dLat = (lat2 - lat1) * 0.017453292519943295;
      const dLon = (lon2 - lon1) * 0.017453292519943295;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * 0.017453292519943295) * Math.cos(lat2 * 0.017453292519943295) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return +(6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    function initMap() {
      map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([17.3297, 76.8343], 10);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
    }

    function render(list) {
      markersLayer.clearLayers();
      const listContainer = document.getElementById('facility-list');
      const countLabel = document.getElementById('results-count');
      listContainer.innerHTML = '';

      countLabel.textContent = currentAnchorPoint 
        ? `Showing closest facilities to ${currentAnchorPoint.name}`
        : `Showing nearest facilities`;

      const mapLimit = Math.min(list.length, 60);
      for (let i = 0; i < mapLimit; i++) {
        const f = list[i];
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;
        const distBadge = f.distanceKm !== undefined ? `<div class="text-emerald-700 font-bold text-[11px] mt-1">📍 ${f.distanceKm} km away</div>` : '';

        const circle = L.circleMarker([f.lat, f.lng], {
          radius: f.tier === 'TERTIARY' ? 6 : 4,
          fillColor: f.tier === 'TERTIARY' ? '#ef4444' : '#10b981',
          color: '#ffffff',
          weight: 1,
          fillOpacity: 0.85
        });

        circle.bindPopup(`
          <div class="text-xs p-1">
            <strong class="text-slate-900 block font-semibold text-xs mb-0.5">${f.name}</strong>
            <div class="text-slate-600 mb-1">${f.city}, ${f.state}</div>
            <span class="inline-block px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-mono text-[9px] font-semibold">${f.tier}</span>
            ${distBadge}
            <a href="${gmapsUrl}" target="_blank" rel="noopener" class="mt-2 block text-center py-1.5 px-2 bg-blue-600 text-white rounded text-[10px] font-medium">
              🚗 Navigate in Google Maps
            </a>
          </div>
        `);
        markersLayer.addLayer(circle);
      }

      const cardLimit = Math.min(list.length, 35);
      const frag = document.createDocumentFragment();

      for (let i = 0; i < cardLimit; i++) {
        const f = list[i];
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;
        const distBadge = f.distanceKm !== undefined 
          ? `<span class="text-xs font-black text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">📍 ${f.distanceKm} km</span>`
          : '';

        const card = document.createElement('div');
        card.className = "p-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-2.5";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <h2 class="text-xs font-bold text-slate-800 leading-snug cursor-pointer hover:text-emerald-600">${f.name}</h2>
              <p class="text-[11px] text-slate-500 mt-0.5">${f.city}, ${f.state}</p>
            </div>
            <div class="flex flex-col items-end gap-1 shrink-0">
              <span class="text-[10px] font-mono px-2 py-0.5 bg-slate-100 text-slate-700 rounded-full border border-slate-200 font-semibold">${f.tier}</span>
              ${distBadge}
            </div>
          </div>

          <a href="${gmapsUrl}" target="_blank" rel="noopener" class="w-full flex items-center justify-center gap-1.5 py-2 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white rounded-xl text-xs font-medium transition shadow-sm">
            <span>🚗</span> Navigate in Google Maps
          </a>
        `;

        card.querySelector('h2').addEventListener('click', () => {
          map.flyTo([f.lat, f.lng], 13, { duration: 0.8 });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        frag.appendChild(card);
      }
      listContainer.appendChild(frag);
    }

    function setLocationAnchor(lat, lng, label) {
      currentAnchorPoint = { lat, lng, name: label };

      const badge = document.getElementById('active-anchor-badge');
      badge.textContent = `📍 Nearest to: ${label}`;
      badge.classList.remove('hidden');
      document.getElementById('clear-btn').classList.remove('hidden');

      if (searchPin) map.removeLayer(searchPin);
      searchPin = L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'pin',
          html: `<div class="w-6 h-6 bg-blue-600 text-white rounded-full border-2 border-white flex items-center justify-center text-xs shadow-md font-bold">📍</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 24]
        })
      }).addTo(map);

      map.flyTo([lat, lng], 10, { duration: 0.8 });

      let ranked = allFacilities.map(f => ({
        ...f,
        distanceKm: calculateDistance(lat, lng, f.lat, f.lng)
      }));

      ranked.sort((a, b) => a.distanceKm - b.distanceKm);
      render(ranked);
    }

    async function executeSearch(query) {
      const q = query.trim();
      if (!q) return;

      const normalized = q.toLowerCase();

      if (LOCAL_GEO_CACHE[normalized]) {
        const hit = LOCAL_GEO_CACHE[normalized];
        setLocationAnchor(hit.lat, hit.lng, hit.name);
        return;
      }

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&limit=1&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          const name = data[0].display_name.split(',')[0];
          setLocationAnchor(lat, lng, name);
          return;
        }
      } catch (e) {}

      const filtered = allFacilities.filter(f => 
        f.city.toLowerCase().includes(normalized) || 
        f.state.toLowerCase().includes(normalized) || 
        f.name.toLowerCase().includes(normalized)
      );

      if (filtered.length > 0) {
        setLocationAnchor(filtered[0].lat, filtered[0].lng, filtered[0].city);
      } else {
        render(allFacilities);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMap();
      allFacilities = generateFacilities();
      document.getElementById('stats-counter').textContent = `${allFacilities.length.toLocaleString()} Facilities`;

      // Initial anchor: Gulbarga
      setLocationAnchor(17.3297, 76.8343, "Gulbarga");

      document.getElementById('search-btn').addEventListener('click', () => {
        executeSearch(document.getElementById('location-input').value);
      });

      document.getElementById('location-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          executeSearch(e.target.value);
        }
      });

      document.getElementById('clear-btn').addEventListener('click', () => {
        document.getElementById('location-input').value = '';
        document.getElementById('clear-btn').classList.add('hidden');
        document.getElementById('active-anchor-badge').classList.add('hidden');
        if (searchPin) map.removeLayer(searchPin);
        currentAnchorPoint = null;
        render(allFacilities);
      });

      document.getElementById('gps-btn').addEventListener('click', () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              setLocationAnchor(pos.coords.latitude, pos.coords.longitude, "Your Location");
            },
            () => {
              alert("Could not access GPS. Please check browser permissions.");
            },
            { enableHighAccuracy: true, timeout: 5000 }
          );
        } else {
          alert("Geolocation is not supported by your browser.");
        }
      });

      setTimeout(() => map.invalidateSize(), 300);
    });
  </script>
</body>
</html>
