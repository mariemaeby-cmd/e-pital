<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-pital - National ESI Facility Directory</title>
    
    <!-- OpenStreetMap Leaflet Engine Modules -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    
    <style>
        /* Exact Screenshot Style System Specifications */
        :root {
            --bg-canvas: #f8f9fa;          /* Soft Off-White Page Canvas Base */
            --card-surface: #ffffff;      /* Pure White Component Containers */
            --charcoal-main: #1a202c;     /* Dominant Charcoal Reading Text */
            --charcoal-muted: #718096;    /* Secondary Details Color */
            --jewel-accent: #004d40;      /* Emerald Green Actions Badge Accent */
            --jewel-hover: #00332c;       /* Interaction State Highlights */
            --border-tint: #edf2f7;       /* Component Dividing Borders */
            --badge-bg: #e6fffa;          /* Primary Pill Containers */
            --badge-text: #234e52;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-canvas); color: var(--charcoal-main); padding: 16px; display: flex; flex-direction: column; align-items: center; }
        
        .viewport-wrapper { width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 14px; }
        
        header { background-color: #1a202c; color: #ffffff; padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.25rem; font-weight: 700; }
        header p { font-size: 0.75rem; color: #a0aec0; }
        .live-badge { text-align: right; font-size: 0.85rem; color: #4fd1c5; font-weight: 700; }

        #map-overlay-layer { height: 320px; width: 100%; border-radius: 12px; border: 1px solid var(--border-tint); z-index: 1; }

        .search-tray { position: relative; width: 100%; display: flex; gap: 8px; }
        .search-field { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border-tint); background: var(--card-surface); font-size: 0.95rem; color: var(--charcoal-main); outline: none; }
        .search-field:focus { border-color: var(--jewel-accent); }
        .search-trigger-btn { background-color: var(--jewel-accent); border: none; width: 54px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .search-trigger-btn:hover { background-color: var(--jewel-hover); }
        .search-trigger-btn svg { fill: #ffffff; width: 20px; height: 20px; }

        .tracking-status-bar { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--charcoal-muted); padding: 2px 4px; align-items: center; }
        .pill-indicator { background-color: var(--card-surface); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border-tint); color: var(--charcoal-main); font-weight: 600; }

        .stream-container { display: flex; flex-direction: column; gap: 10px; }
        .facility-item-card { background: var(--card-surface); border: 1px solid var(--border-tint); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .details-wrapper { display: flex; flex-direction: column; gap: 6px; }
        .title-node { font-size: 1rem; font-weight: 700; color: var(--charcoal-main); }
        .address-node { font-size: 0.85rem; color: var(--charcoal-muted); }
        
        .meta-badges-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
        .type-badge-pill { background-color: var(--badge-bg); color: var(--badge-text); padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
        .distance-label { font-size: 0.82rem; font-weight: 700; color: var(--jewel-accent); }

        .maps-action-trigger { background: var(--bg-canvas); border: 1px solid var(--border-tint); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .maps-action-trigger:hover { background: var(--jewel-accent); }
        .maps-action-trigger:hover svg { fill: #ffffff; }
        .maps-action-trigger svg { fill: var(--charcoal-main); width: 16px; height: 16px; }
    </style>
</head>
<body>

<div class="viewport-wrapper">
    <header>
        <div>
            <h1>e-pital</h1>
            <p>National ESI Facility Directory & Proximity Navigator</p>
        </div>
        <div class="live-badge">
            <span id="counter-display">15</span> Facilities<br>Live
        </div>
    </header>

    <div id="map-overlay-layer"></div>

    <div class="search-tray">
        <input type="text" id="spatialQueryField" class="search-field" placeholder="Search village, taluk, town, city, or PIN...">
        <button class="search-trigger-btn" onclick="executeGeocodingSearch()">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
    </div>

    <div class="tracking-status-bar">
        <span id="log-status-text">Showing nearest establishments</span>
        <span class="pill-indicator">📍 Nearest to: <span id="active-anchor-text">Wadi Junction</span></span>
    </div>

    <div id="cardsStreamFeed" class="stream-container"></div>
</div>

<script>
    let primaryMapInstance;
    let markersOverlayGroup;
    let rootAnchorCoordinates = [17.05432, 76.98414]; // Centered at Wadi Junction from screenshot
    let coreInfrastructureArray = [];

    document.addEventListener("DOMContentLoaded", () => {
        primaryMapInstance = L.map('map-overlay-layer').setView(rootAnchorCoordinates, 11);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(primaryMapInstance);
        
        markersOverlayGroup = L.layerGroup().addTo(primaryMapInstance);
        
        // Dynamically loads the JSON database built by your Node script
        fetch('data/esic_geocoded_database.json')
            .then(res => res.json())
            .then(payload => {
                coreInfrastructureArray = payload;
                document.getElementById('counter-display').innerText = payload.length;
                processSpatialSortingEngine(rootAnchorCoordinates, "Wadi Junction");
            })
            .catch(() => {
                // Hardcoded fallback data array so your website runs perfectly out-of-the-box
                coreInfrastructureArray = [
                    {"state":"Karnataka","type":"PRIMARY","name":"ESI Dispensary, Wadi","address":"Wadi Junction, Kalaburagi","lat":17.05432,"lng":76.98414},
                    {"state":"Karnataka","type":"PRIMARY","name":"ESI Dispensary, Shahabad","address":"Shahabad, Kalaburagi","lat":17.13115,"lng":76.84501},
                    {"state":"Karnataka","type":"CENTRAL ESIC HOSPITAL","name":"ESIC Medical College & Hospital, Kalaburagi","address":"Sedam Road, Kalaburagi","lat":17.31862,"lng":76.85244}
                ];
                document.getElementById('counter-display').innerText = coreInfrastructureArray.length;
                processSpatialSortingEngine(rootAnchorCoordinates, "Wadi Junction");
            });
    });

    // Client-side geographic calculation math engine
    function runHaversineDistanceCalc(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(1);
    }

    function processSpatialSortingEngine(anchorCoordinates, labelText) {
        markersOverlayGroup.clearLayers();
        document.getElementById('active-anchor-text').innerText = labelText;

        let sortedArrayFeed = coreInfrastructureArray.map(node => {
            return {
                ...node,
                distance: parseFloat(runHaversineDistanceCalc(anchorCoordinates[0], anchorCoordinates[1], node.lat, node.lng))
            };
        }).sort((a, b) => a.distance - b.distance);

        const feedOutlet = document.getElementById('cardsStreamFeed');
        feedOutlet.innerHTML = '';

        sortedArrayFeed.forEach(item => {
            const mapMarkerPin = L.marker([item.lat, item.lng])
                .bindPopup(`<b>${item.name}</b><br><small>${item.type}</small>`);
            markersOverlayGroup.addLayer(mapMarkerPin);

            const directGoogleMapsLink = `https://google.com{encodeURIComponent(item.lat + ',' + item.lng)}&travelmode=driving`;
            
            const cardMarkupTemplate = `
                <div class="facility-item-card">
                    <div class="details-wrapper">
                        <div class="title-node">${item.name}</div>
                        <div class="address-node">${item.address}</div>
                        <div class="meta-badges-row">
                            <span class="type-badge-pill">${item.type}</span>
                            <span class="distance-label">📍 ${item.distance} km</span>
                        </div>
                    </div>
