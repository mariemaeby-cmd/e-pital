    function calculateDistance(lat1, lon1, lat2, lon2) {
      const dLat = (lat2 - lat1) * 0.017453292519943295;
      const dLon = (lon2 - lon1) * 0.017453292519943295;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * 0.017453292519943295) * Math.cos(lat2 * 0.017453292519943295) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return +(6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    function initMap() {
      map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([20.5937, 78.9629], 5);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      setTimeout(() => { map.invalidateSize(); }, 250);
    }

    function openClinicalModal(facility) {
      document.getElementById('modal-title').textContent = facility.name;
      document.getElementById('modal-subtitle').textContent = `${facility.district}, ${facility.state} • ${facility.pincode}`;
      
      const badge = document.getElementById('modal-tier-badge');
      badge.textContent = `${facility.tier} • ${facility.admin}`;
      
      // Render departments
      const deptsContainer = document.getElementById('modal-depts');
      deptsContainer.innerHTML = facility.departments.map(d => 
        `<span class="px-2 py-1 bg-slate-100 border border-slate-200 text-slate-700 rounded text-[10px] font-medium">${d}</span>`
      ).join('');

      // Render investigations
      const invContainer = document.getElementById('modal-investigations');
      invContainer.innerHTML = facility.investigations.map(inv => 
        `<span class="px-2 py-1 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded text-[10px] font-medium">${inv}</span>`
      ).join('');

      document.getElementById('modal-drugs').textContent = facility.drugs;
      document.getElementById('modal-referral-note').textContent = facility.referral_rule;
      
      const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${facility.lat},${facility.lng}`;
      document.getElementById('modal-gmaps-link').href = gmapsUrl;

      document.getElementById('clinical-modal').classList.remove('hidden');
    }

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      document.getElementById('clinical-modal').classList.add('hidden');
    });
