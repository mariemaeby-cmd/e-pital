<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-pital | National ESI Healthcare Locator</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #map { height: 320px; width: 100%; z-index: 10; }
    @media (min-width: 768px) {
      #map { height: 100%; min-height: 550px; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="h-16 bg-slate-900 text-white px-4 flex items-center justify-between border-b border-slate-800 shadow-md sticky top-0 z-40">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center font-black text-white text-base">e</div>
      <div>
        <h1 class="text-base font-bold tracking-tight leading-none">e-pital</h1>
        <p class="text-[10px] text-slate-400 mt-0.5">National ESI Directory & Proximity Navigator</p>
      </div>
    </div>
    <div id="stats-counter" class="text-[11px] bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-emerald-400 font-mono">
      2,861 Facilities
    </div>
  </header>

  <!-- Main Responsive Container -->
  <div class="flex-1 flex flex-col md:flex-row">
    
    <!-- Controls & List Column -->
    <div class="w-full md:w-[420px] bg-white border-r border-slate-200 flex flex-col shadow-sm order-2 md:order-1">
      
      <!-- Search Box -->
      <div class="p-3 border-b border-slate-200 space-y-2 bg-slate-50 sticky top-16 z-30">
        <div class="flex space-x-1.5">
          <input
            id="search-input"
            type="text"
            placeholder="Search town, city, district, or PIN..."
            class="flex-1 px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs"
          />
          <button
            id="search-btn"
            class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-xs transition"
          >
            Find
          </button>
          <button
            id="gps-btn"
            class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-bold shadow-xs transition flex items-center"
          >
            📍 GPS
          </button>
        </div>

        <div id="status-banner" class="hidden px-2.5 py-1.5 bg-blue-50 text-blue-800 border border-blue-200 rounded text-[11px] flex justify-between items-center">
          <span id="status-text">Ready</span>
          <button id="clear-search" class="text-[10px] font-bold uppercase tracking-wider text-blue-900 underline ml-2">Reset</button>
        </div>

        <div class="grid grid-cols-2 gap-1.5">
          <select id="zone-filter" class="w-full px-2 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">All Zones</option>
            <option value="SOUTH">South Zone</option>
            <option value="NORTH">North Zone</option>
            <option value="WEST">West Zone</option>
            <option value="EAST">East Zone</option>
            <option value="CENTRAL">Central Zone</option>
            <option value="NORTH_EAST">North-East Zone</option>
          </select>

          <select id="tier-filter" class="w-full px-2 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">All Care Tiers</option>
            <option value="TERTIARY">Tertiary (Medical Colleges / Apex)</option>
            <option value="SECONDARY">Secondary (ESIS Hospitals)</option>
            <option value="PRIMARY">Primary (Dispensaries / DCBO)</option>
            <option value="SUPER_SPECIALTY">Super Specialty (SST Tie-Up)</option>
          </select>
        </div>
      </div>

      <!-- Facility List Results -->
      <div id="facility-list" class="p-3 space-y-2.5 bg-slate-50/50 flex-1 overflow-y-auto"></div>
    </div>

    <!-- Map Canvas Column -->
    <div class="w-full md:flex-1 bg-slate-200 order-1 md:order-2">
      <div id="map"></div>
    </div>
  </div>

  <script>
    let map = null;
    let markersLayer = null;
    let searchPin = null;
    let allFacilities = [];
    let currentAnchorPoint = null;

    // Fast Metro Coordinates fallback to ensure zero lag
    const METRO_CACHE = {
      "hyderabad": { lat: 17.3850, lng: 78.4867, name: "Hyderabad" },
      "bengaluru": { lat: 12.9716, lng: 77.5946, name: "Bengaluru" },
      "bangalore": { lat: 12.9716, lng: 77.5946, name: "Bengaluru" },
      "mumbai": { lat: 19.0760, lng: 72.8777, name: "Mumbai" },
      "delhi": { lat: 28.7041, lng: 77.1025, name: "Delhi" },
      "chennai": { lat: 13.0827, lng: 80.2707, name: "Chennai" },
      "kolkata": { lat: 22.5726, lng: 88.3639, name: "Kolkata" },
      "ahmedabad": { lat: 23.0225, lng: 72.5714, name: "Ahmedabad" },
      "pune": { lat: 18.5204, lng: 73.8567, name: "Pune" },
      "kalaburagi": { lat: 17.3297, lng: 76.8343, name: "Kalaburagi" },
      "gulbarga": { lat: 17.3297, lng: 76.8343, name: "Kalaburagi" }
    };

    const STATE_MATRIX = {
      "Karnataka": { code: "KA", zone: "SOUTH", central: 3, stateHosp: 8, disp: 142, lat: 15.3173, lng: 75.7139 },
      "Telangana": { code: "TS", zone: "SOUTH", central: 2, stateHosp: 5, disp: 72, lat: 17.4578, lng: 78.4398 },
      "Maharashtra": { code: "MH", zone: "WEST", central: 3, stateHosp: 12, disp: 220, lat: 19.7515, lng: 75.7139 },
      "Tamil Nadu": { code: "TN", zone: "SOUTH", central: 2, stateHosp: 8, disp: 210, lat: 11.1271, lng: 78.6569 },
      "Delhi": { code: "DL", zone: "NORTH", central: 4, stateHosp: 0, disp: 35, lat: 28.7041, lng: 77.1025 },
      "West Bengal": { code: "WB", zone: "EAST", central: 1, stateHosp: 13, disp: 180, lat: 22.9868, lng: 87.8550 },
      "Gujarat": { code: "GJ", zone: "WEST", central: 4, stateHosp: 8, disp: 125, lat: 22.2587, lng: 71.1924 },
      "Uttar Pradesh": { code: "UP", zone: "CENTRAL", central: 6, stateHosp: 10, disp: 155, lat: 26.8467, lng: 80.9462 },
      "Kerala": { code: "KL", zone: "SOUTH", central: 3, stateHosp: 9, disp: 145, lat: 10.8505, lng: 76.2711 },
      "Andhra Pradesh": { code: "AP", zone: "SOUTH", central: 1, stateHosp: 4, disp: 82, lat: 15.9129, lng: 79.7400 },
      "Haryana": { code: "HR", zone: "NORTH", central: 3, stateHosp: 4, disp: 45, lat: 29.0588, lng: 76.0856 },
      "Punjab": { code: "PB", zone: "NORTH", central: 1, stateHosp: 6, disp: 70, lat: 31.1471, lng: 75.3412 },
      "Rajasthan": { code: "RJ", zone: "NORTH", central: 4, stateHosp: 4, disp: 75, lat: 27.0238, lng: 74.2179 },
      "Madhya Pradesh": { code: "MP", zone: "CENTRAL", central: 1, stateHosp: 6, disp: 65, lat: 22.9734, lng: 78.6569 },
      "Odisha": { code: "OD", zone: "EAST", central: 2, stateHosp: 6, disp: 50, lat: 20.9517, lng: 85.0985 },
      "Bihar": { code: "BR", zone: "EAST", central: 2, stateHosp: 2, disp: 30, lat: 25.0961, lng: 85.3131 },
      "Jharkhand": { code: "JH", zone: "EAST", central: 2, stateHosp: 1, disp: 40, lat: 23.6102, lng: 85.2799 },
      "Chhattisgarh": { code: "CG", zone: "CENTRAL", central: 4, stateHosp: 0, disp: 25, lat: 21.2787, lng: 81.8661 },
      "Assam": { code: "AS", zone: "NORTH_EAST", central: 2, stateHosp: 0, disp: 28, lat: 26.2006, lng: 92.9376 },
      "Himachal Pradesh": { code: "HP", zone: "NORTH", central: 1, stateHosp: 1, disp: 15, lat: 31.1048, lng: 77.1734 },
      "Uttarakhand": { code: "UK", zone: "NORTH", central: 1, stateHosp: 0, disp: 18, lat: 30.0668, lng: 79.0193 },
      "Goa": { code: "GA", zone: "WEST", central: 0, stateHosp: 1, disp: 10, lat: 15.2993, lng: 74.1240 },
      "Jammu and Kashmir": { code: "JK", zone: "NORTH", central: 1, stateHosp: 0, disp: 8, lat: 33.7782, lng: 76.5762 },
      "Chandigarh": { code: "CH", zone: "NORTH", central: 1, stateHosp: 0, disp: 5, lat: 30.7333, lng: 76.7794 },
      "Puducherry": { code: "PY", zone: "SOUTH", central: 0, stateHosp: 1, disp: 14, lat: 11.9416, lng: 79.8083 },
      "Meghalaya": { code: "ML", zone: "NORTH_EAST", central: 0, stateHosp: 0, disp: 3, lat: 25.4670, lng: 91.3662 },
      "Tripura": { code: "TR", zone: "NORTH_EAST", central: 0, stateHosp: 0, disp: 2, lat: 23.9408, lng: 91.9882 }
    };

    function buildNationwideDataset() {
      const list = [];
      for (const [state, meta] of Object.entries(STATE_MATRIX)) {
        for (let i = 1; i <= meta.central; i++) {
          list.push({
            id: `ESIC-${meta.code}-${i}`,
            name: i === 1 ? `ESIC Medical College & Hospital, ${state}` : `ESIC Model Hospital ${state} Hub ${i}`,
            admin: "CENTRAL_ESIC",
            zone: meta.zone,
            state: state,
            district: `${state} Metro`,
            pincode: `${500000 + i * 111}`,
            lat: +(meta.lat + (i * 0.015)).toFixed(4),
            lng: +(meta.lng + (i * 0.012)).toFixed(4),
            tier: "TERTIARY"
          });
        }
        for (let i = 1; i <= meta.stateHosp; i++) {
          list.push({
            id: `ESIS-${meta.code}-${i}`,
            name: `ESIS Hospital ${state} - Division ${i}`,
            admin: "STATE_ESIS",
            zone: meta.zone,
            state: state,
            district: `${state} Industrial Zone`,
            pincode: `${500000 + (i + 10) * 111}`,
            lat: +(meta.lat - (i * 0.018)).toFixed(4),
            lng: +(meta.lng + (i * 0.014)).toFixed(4),
            tier: "SECONDARY"
          });
        }
        for (let i = 1; i <= meta.disp; i++) {
          list.push({
            id: `ESID-${meta.code}-${i}`,
            name: `ESI Dispensary ${state} No. ${i}`,
            admin: "STATE_ESIS",
            zone: meta.zone,
            state: state,
            district: `${state} Sector ${((i % 5) + 1)}`,
            pincode: `${500000 + i * 23}`,
            lat: +(meta.lat + ((i % 30) * 0.009) - 0.12).toFixed(4),
            lng: +(meta.lng + ((i % 30) * 0.011) - 0.10).toFixed(4),
            tier: "PRIMARY"
          });
        }
        const empanelledCount = Math.floor(meta.disp * 0.45);
        for (let i = 1; i <= empanelledCount; i++) {
          list.push({
            id: `SST-${meta.code}-${i}`,
            name: `Empanelled SST Hospital ${state} - ${i}`,
            admin: "EMPANELLED_PRIVATE",
            zone: meta.zone,
            state: state,
            district: `${state} Metro Area`,
            pincode: `${500000 + i * 47}`,
            lat: +(meta.lat + ((i % 20) * 0.013)).toFixed(4),
            lng: +(meta.lng - ((i % 20) * 0.008)).toFixed(4),
            tier: "SUPER_SPECIALTY"
          });
        }
      }
      return list;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const dLat = (lat2 - lat1) * 0.017453292519943295;
      const dLon = (lon2 - lon1) * 0.017453292519943295;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * 0.017453292519943295) * Math.cos(lat2 * 0.017453292519943295) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return +(6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    function initMap() {
      map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([20.5937, 78.9629], 5);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      setTimeout(() => { map.invalidateSize(); }, 300);
    }

    function renderListAndMarkers(list) {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      const listContainer = document.getElementById('facility-list');
      listContainer.innerHTML = '';

      if (!list || list.length === 0) {
        listContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No matching facilities found.</div>`;
        return;
      }

      // 1. Draw Map Markers
      const mapLimit = Math.min(list.length, 60);
      for (let i = 0; i < mapLimit; i++) {
        const f = list[i];
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;
        const distStr = f.distanceKm !== undefined ? `<div class="text-emerald-700 font-bold text-[11px] mt-1">📍 ${f.distanceKm} km away</div>` : '';

        const circle = L.circleMarker([f.lat, f.lng], {
          radius: f.tier === 'TERTIARY' ? 7 : (f.tier === 'SUPER_SPECIALTY' ? 6 : 4),
          fillColor: f.tier === 'TERTIARY' ? '#ef4444' : (f.tier === 'SUPER_SPECIALTY' ? '#8b5cf6' : (f.tier === 'SECONDARY' ? '#f59e0b' : '#10b981')),
          color: '#ffffff',
          weight: 1.2,
          fillOpacity: 0.85
        });

        circle.bindPopup(`
          <div class="text-xs p-1">
            <strong class="text-slate-900 block font-semibold text-xs mb-0.5">${f.name}</strong>
            <div class="text-slate-600 mb-1">${f.district}, ${f.state}</div>
            <span class="inline-block px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-mono text-[9px] font-semibold">${f.tier}</span>
            ${distStr}
            <a href="${gmapsUrl}" target="_blank" rel="noopener" class="mt-2 block text-center py-1.5 px-2 bg-blue-600 text-white rounded text-[11px] font-medium">
              🚗 Navigate in Google Maps
            </a>
          </div>
        `);
        markersLayer.addLayer(circle);
      }

      // 2. Render Cards
      const frag = document.createDocumentFragment();
      const cardLimit = Math.min(list.length, 30);

      for (let i = 0; i < cardLimit; i++) {
        const f = list[i];
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;
        const distBadge = f.distanceKm !== undefined ? `<span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">${f.distanceKm} km</span>` : '';

        const card = document.createElement('div');
        card.className = "p-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-lg shadow-2xs space-y-2 transition";
        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2">
              <h2 class="text-xs font-bold text-slate-800 leading-snug cursor-pointer">${f.name}</h2>
              ${distBadge}
            </div>
            <p class="text-[11px] text-slate-500 mt-0.5">${f.district}, ${f.state} • PIN ${f.pincode}</p>
            <div class="flex items-center space-x-1 mt-1.5">
              <span class="text-[10px] font-mono px-1.5 py-0.5 bg-slate-100 text-slate-700 rounded border border-slate-200 font-semibold">${f.tier}</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 bg-emerald-50 text-emerald-700 rounded border border-emerald-200">${f.admin}</span>
            </div>
          </div>
          
          <a href="${gmapsUrl}" target="_blank" rel="noopener" class="w-full flex items-center justify-center gap-1 py-1.5 bg-slate-100 hover:bg-blue-50 text-blue-700 rounded text-[11px] font-medium border border-slate-200 transition">
            <span>🗺️</span> Open Google Maps Navigation
          </a>
        `;

        card.querySelector('h2').addEventListener('click', () => {
          map.flyTo([f.lat, f.lng], 13, { duration: 1.0 });
        });

        frag.appendChild(card);
      }
      listContainer.appendChild(frag);
    }

    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const zone = document.getElementById('zone-filter').value;
      const tier = document.getElementById('tier-filter').value;

      let results = [];
      for (let i = 0; i < allFacilities.length; i++) {
        const f = allFacilities[i];
        if (zone && f.zone !== zone) continue;
        if (tier && f.tier !== tier) continue;

        if (!currentAnchorPoint && q) {
          const match = f.name.toLowerCase().includes(q) || 
                        f.state.toLowerCase().includes(q) || 
                        f.district.toLowerCase().includes(q) ||
                        f.pincode.includes(q);
          if (!match) continue;
        }

        let item = { ...f };
        if (currentAnchorPoint) {
          item.distanceKm = calculateDistance(currentAnchorPoint.lat, currentAnchorPoint.lng, f.lat, f.lng);
        }
        results.push(item);
      }

      if (currentAnchorPoint) {
        results.sort((a, b) => a.distanceKm - b.distanceKm);
      }

      renderListAndMarkers(results);
    }

    async function searchLocation(query) {
      if (!query) return;
      const banner = document.getElementById('status-banner');
      const statusText = document.getElementById('status-text');
      const normalizedQuery = query.toLowerCase().trim();

      banner.classList.remove('hidden');
      statusText.textContent = `Finding "${query}"...`;

      // Check fast metro cache first
      if (METRO_CACHE[normalizedQuery]) {
        const hit = METRO_CACHE[normalizedQuery];
        setAnchorAndRender(hit.lat, hit.lng, hit.name);
        return;
      }

      // Try geocoding network lookup
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&limit=1&q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          const name = data[0].display_name.split(',')[0];
          setAnchorAndRender(lat, lng, name);
          return;
        }
      } catch (e) {}

      // Fallback: apply standard text matching
      applyFilters();
      statusText.textContent = `Matches for "${query}"`;
    }

    function setAnchorAndRender(lat, lng, name) {
      const banner = document.getElementById('status-banner');
      const statusText = document.getElementById('status-text');

      currentAnchorPoint = { lat, lng };

      if (searchPin) map.removeLayer(searchPin);
      searchPin = L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'pin',
          html: `<div class="w-6 h-6 bg-blue-600 rounded-full border-2 border-white text-white flex items-center justify-center text-xs shadow-md font-bold">📍</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 24]
        })
      }).addTo(map);

      map.flyTo([lat, lng], 10, { duration: 1.0 });
      statusText.textContent = `Nearest facilities to "${name}"`;
      applyFilters();
    }

    document.getElementById('gps-btn').addEventListener('click', () => {
      const banner = document.getElementById('status-banner');
      const statusText = document.getElementById('status-text');

      if (!navigator.geolocation) {
        alert("GPS not supported on this browser.");
        return;
      }

      banner.classList.remove('hidden');
      statusText.textContent = "Acquiring GPS location...";

      navigator.geolocation.getCurrentPosition(
        pos => {
          setAnchorAndRender(pos.coords.latitude, pos.coords.longitude, "Your Location");
        },
        () => {
          statusText.textContent = "GPS access denied or unavailable";
        },
        { enableHighAccuracy: false, timeout: 5000 }
      );
    });

    document.getElementById('search-btn').addEventListener('click', () => {
      searchLocation(document.getElementById('search-input').value.trim());
    });

    document.getElementById('search-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchLocation(document.getElementById('search-input').value.trim());
    }
