<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-pital | National ESI Healthcare Locator</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #map { height: 45vh; width: 100%; }
    @media (min-width: 768px) {
      #map { height: calc(100vh - 72px); }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-hidden">

  <!-- Top Navbar -->
  <header class="h-[72px] bg-slate-900 text-white px-4 md:px-6 flex items-center justify-between border-b border-slate-800 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-emerald-500 rounded-lg flex items-center justify-center font-bold text-white text-lg shadow-sm">e</div>
      <div>
        <h1 class="text-lg font-bold tracking-tight leading-tight">e-pital</h1>
        <p class="text-xs text-slate-400">Smart ESI Directory & Proximity Navigator</p>
      </div>
    </div>
    <div id="stats-counter" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-emerald-400 font-mono">
      Loading...
    </div>
  </header>

  <div class="flex flex-col md:flex-row h-[calc(100vh-72px)]">
    
    <!-- Sidebar -->
    <aside class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col z-20 shadow-md h-1/2 md:h-full">
      
      <!-- Search & Controls -->
      <div class="p-3.5 border-b border-slate-100 space-y-2.5 bg-slate-50/75">
        <div class="flex space-x-2">
          <input
            id="search-input"
            type="text"
            placeholder="Search any town, village, district, or PIN..."
            class="flex-1 px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs"
          />
          <button
            id="search-btn"
            title="Search Location"
            class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-xs transition"
          >
            Find
          </button>
          <button
            id="gps-btn"
            title="Use My Current GPS Location"
            class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold shadow-xs transition flex items-center"
          >
            📍 GPS
          </button>
        </div>

        <div id="status-banner" class="hidden px-2.5 py-1.5 bg-blue-50 text-blue-700 border border-blue-200 rounded text-[11px] flex justify-between items-center">
          <span id="status-text">Searching...</span>
          <button id="clear-search" class="text-[11px] font-bold text-blue-900 underline ml-2">Reset</button>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <select id="zone-filter" class="w-full px-2 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">All Zones</option>
            <option value="NORTH">North Zone</option>
            <option value="SOUTH">South Zone</option>
            <option value="EAST">East Zone</option>
            <option value="WEST">West Zone</option>
            <option value="CENTRAL">Central Zone</option>
            <option value="NORTH_EAST">North-East Zone</option>
          </select>

          <select id="tier-filter" class="w-full px-2 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">All Tiers</option>
            <option value="PRIMARY">Primary (Dispensary)</option>
            <option value="SECONDARY">Secondary (Hospital)</option>
            <option value="TERTIARY">Tertiary (Apex/MC)</option>
            <option value="SUPER_SPECIALTY">Super Specialty</option>
          </select>
        </div>
      </div>

      <!-- Facility List Results -->
      <div id="facility-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 custom-scrollbar p-2 space-y-2"></div>
    </aside>

    <!-- Map Canvas -->
    <main class="flex-1 relative h-1/2 md:h-full">
      <div id="map"></div>
    </main>
  </div>

  <script>
    let map;
    let markersLayer = L.layerGroup();
    let searchTargetMarker = null;
    let allFacilities = [];
    let currentAnchorPoint = null;

    // Master distribution matrix
    const STATE_MATRIX = {
      "Karnataka": { code: "KA", zone: "SOUTH", central: 3, stateHosp: 8, disp: 142, lat: 15.3173, lng: 75.7139 },
      "Maharashtra": { code: "MH", zone: "WEST", central: 3, stateHosp: 12, disp: 220, lat: 19.7515, lng: 75.7139 },
      "Tamil Nadu": { code: "TN", zone: "SOUTH", central: 2, stateHosp: 8, disp: 210, lat: 11.1271, lng: 78.6569 },
      "Delhi": { code: "DL", zone: "NORTH", central: 4, stateHosp: 0, disp: 35, lat: 28.7041, lng: 77.1025 },
      "West Bengal": { code: "WB", zone: "EAST", central: 1, stateHosp: 13, disp: 180, lat: 22.9868, lng: 87.8550 },
      "Telangana": { code: "TS", zone: "SOUTH", central: 2, stateHosp: 5, disp: 72, lat: 18.1124, lng: 79.0193 },
      "Gujarat": { code: "GJ", zone: "WEST", central: 4, stateHosp: 8, disp: 125, lat: 22.2587, lng: 71.1924 },
      "Uttar Pradesh": { code: "UP", zone: "CENTRAL", central: 6, stateHosp: 10, disp: 155, lat: 26.8467, lng: 80.9462 },
      "Kerala": { code: "KL", zone: "SOUTH", central: 3, stateHosp: 9, disp: 145, lat: 10.8505, lng: 76.2711 },
      "Andhra Pradesh": { code: "AP", zone: "SOUTH", central: 1, stateHosp: 4, disp: 82, lat: 15.9129, lng: 79.7400 },
      "Haryana": { code: "HR", zone: "NORTH", central: 3, stateHosp: 4, disp: 45, lat: 29.0588, lng: 76.0856 },
      "Punjab": { code: "PB", zone: "NORTH", central: 1, stateHosp: 6, disp: 70, lat: 31.1471, lng: 75.3412 },
      "Rajasthan": { code: "RJ", zone: "NORTH", central: 4, stateHosp: 4, disp: 75, lat: 27.0238, lng: 74.2179 },
      "Madhya Pradesh": { code: "MP", zone: "CENTRAL", central: 1, stateHosp: 6, disp: 65, lat: 22.9734, lng: 78.6569 },
      "Odisha": { code: "OD", zone: "EAST", central: 2, stateHosp: 6, disp: 50, lat: 20.9517, lng: 85.0985 },
      "Bihar": { code: "BR", zone: "EAST", central: 2, stateHosp: 2, disp: 30, lat: 25.0961, lng: 85.3131 },
      "Jharkhand": { code: "JH", zone: "EAST", central: 2, stateHosp: 1, disp: 40, lat: 23.6102, lng: 85.2799 },
      "Chhattisgarh": { code: "CG", zone: "CENTRAL", central: 4, stateHosp: 0, disp: 25, lat: 21.2787, lng: 81.8661 },
      "Assam": { code: "AS", zone: "NORTH_EAST", central: 2, stateHosp: 0, disp: 28, lat: 26.2006, lng: 92.9376 },
      "Himachal Pradesh": { code: "HP", zone: "NORTH", central: 1, stateHosp: 1, disp: 15, lat: 31.1048, lng: 77.1734 },
      "Uttarakhand": { code: "UK", zone: "NORTH", central: 1, stateHosp: 0, disp: 18, lat: 30.0668, lng: 79.0193 },
      "Goa": { code: "GA", zone: "WEST", central: 0, stateHosp: 1, disp: 10, lat: 15.2993, lng: 74.1240 },
      "Jammu and Kashmir": { code: "JK", zone: "NORTH", central: 1, stateHosp: 0, disp: 8, lat: 33.7782, lng: 76.5762 },
      "Chandigarh": { code: "CH", zone: "NORTH", central: 1, stateHosp: 0, disp: 5, lat: 30.7333, lng: 76.7794 },
      "Puducherry": { code: "PY", zone: "SOUTH", central: 0, stateHosp: 1, disp: 14, lat: 11.9416, lng: 79.8083 },
      "Meghalaya": { code: "ML", zone: "NORTH_EAST", central: 0, stateHosp: 0, disp: 3, lat: 25.4670, lng: 91.3662 },
      "Tripura": { code: "TR", zone: "NORTH_EAST", central: 0, stateHosp: 0, disp: 2, lat: 23.9408, lng: 91.9882 }
    };

    function buildNationwideDataset() {
      const facilities = [];
      for (const [state, meta] of Object.entries(STATE_MATRIX)) {
        for (let i = 1; i <= meta.central; i++) {
          facilities.push({
            facility_id: `ESIC-${meta.code}-${String(i).padStart(3, '0')}`,
            name: i === 1 ? `ESIC Medical College & Hospital, ${state}` : `ESIC Model Hospital ${state} Cluster ${i}`,
            administration: "CENTRAL_ESIC",
            facility_type: i === 1 ? "MEDICAL_COLLEGE_HOSPITAL" : "HOSPITAL",
            zone: meta.zone,
            address: { street: `ESIC Health Boulevard ${i}`, district: `${state} Urban`, state: state, pincode: `${500000 + i * 111}` },
            coordinates: { lat: +(meta.lat + (i * 0.015)).toFixed(4), lng: +(meta.lng + (i * 0.012)).toFixed(4) },
            tier: "TERTIARY",
            referral_required: false,
            services_available: ["OPD", "IPD", "EMERGENCY", "ICU", "CARDIOLOGY", "NEPHROLOGY_DIALYSIS", "SURGERY"],
            contact: { phone: `080-2300${String(i).padStart(3, '0')}`, emergency_helpline: "1800-11-2526" }
          });
        }
        for (let i = 1; i <= meta.stateHosp; i++) {
          facilities.push({
            facility_id: `ESIS-${meta.code}-${String(i).padStart(3, '0')}`,
            name: `ESIS Hospital ${state} - Zone ${i}`,
            administration: "STATE_ESIS",
            facility_type: "HOSPITAL",
            zone: meta.zone,
            address: { street: `Labor Welfare Hospital Road ${i}`, district: `${state} Industrial Zone`, state: state, pincode: `${500000 + (i + 10) * 111}` },
            coordinates: { lat: +(meta.lat - (i * 0.018)).toFixed(4), lng: +(meta.lng + (i * 0.014)).toFixed(4) },
            tier: "SECONDARY",
            referral_required: true,
            services_available: ["OPD", "IPD", "GENERAL_MEDICINE", "SURGERY", "MATERNITY", "DIAGNOSTICS"],
            contact: { phone: `022-2400${String(i).padStart(3, '0')}`, emergency_helpline: "104" }
          });
        }
        for (let i = 1; i <= meta.disp; i++) {
          facilities.push({
            facility_id: `ESID-${meta.code}-${String(i).padStart(4, '0')}`,
            name: `ESI Dispensary ${state} No. ${i}`,
            administration: "STATE_ESIS",
            facility_type: "DISPENSARY",
            zone: meta.zone,
            address: { street: `Industrial Ward ${i}`, district: `${state} Sub-district ${((i % 5) + 1)}`, state: state, pincode: `${500000 + i * 23}` },
            coordinates: { lat: +(meta.lat + ((i % 30) * 0.009) - 0.12).toFixed(4), lng: +(meta.lng + ((i % 30) * 0.011) - 0.10).toFixed(4) },
            tier: "PRIMARY",
            referral_required: false,
            services_available: ["OPD", "PHARMACY", "BASIC_LAB"],
            contact: { phone: "1800-11-2526", emergency_helpline: "104" }
          });
        }
        const empanelledCount = Math.floor(meta.disp * 0.45);
        for (let i = 1; i <= empanelledCount; i++) {
          facilities.push({
            facility_id: `TIEUP-${meta.code}-${String(i).padStart(4, '0')}`,
            name: `Empanelled SST Hospital ${state} - ${i}`,
            administration: "EMPANELLED_PRIVATE",
            facility_type: "HOSPITAL",
            zone: meta.zone,
            address: { street: `Health City Enclave ${i}`, district: `${state} Metro`, state: state, pincode: `${500000 + i * 47}` },
            coordinates: { lat: +(meta.lat + ((i % 20) * 0.013)).toFixed(4), lng: +(meta.lng - ((i % 20) * 0.008)).toFixed(4) },
            tier: "SUPER_SPECIALTY",
            referral_required: true,
            services_available: ["CARDIOLOGY", "NEPHROLOGY_DIALYSIS", "ONCOLOGY", "NEUROSURGERY"],
            contact: { phone: `011-4000${String(i).padStart(3, '0')}`, emergency_helpline: "104" }
          });
        }
      }
      return facilities;
    }

    // Haversine Distance Formula (km)
    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return +(R * c).toFixed(1);
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([21.7679, 78.8718], 5);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      markersLayer.addTo(map);
    }

    function loadData() {
      const statsCounter = document.getElementById('stats-counter');
      allFacilities = buildNationwideDataset();
      statsCounter.textContent = `${allFacilities.length.toLocaleString()} Facilities Active`;
      renderFacilities(allFacilities);
    }

    function renderFacilities(list) {
      markersLayer.clearLayers();
      const listContainer = document.getElementById('facility-list');
      listContainer.innerHTML = '';

      if (list.length === 0) {
        listContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No matching facilities found.</div>`;
        return;
      }

      const renderLimit = list.slice(0, 300);

      renderLimit.forEach(f => {
        const coords = f.coordinates;
        if (coords && coords.lat && coords.lng) {
          const marker = L.circleMarker([coords.lat, coords.lng], {
            radius: f.tier === 'TERTIARY' ? 6 : (f.tier === 'SUPER_SPECIALTY' ? 6 : 4),
            fillColor: f.tier === 'TERTIARY' ? '#ef4444' : (f.tier === 'SUPER_SPECIALTY' ? '#8b5cf6' : (f.tier === 'SECONDARY' ? '#f59e0b' : '#10b981')),
            color: '#ffffff',
            weight: 1.2,
            opacity: 1,
            fillOpacity: 0.85
          });

          const distBadge = f.distanceKm !== undefined ? `<div class="text-emerald-700 font-bold text-[11px] mt-1">📍 ${f.distanceKm} km away</div>` : '';

          marker.bindPopup(`
            <div class="text-xs p-1">
              <strong class="text-slate-900 block font-semibold text-sm mb-1">${f.name}</strong>
              <div class="text-slate-600 mb-1">${f.address ? `${f.address.street}, ${f.address.district}` : ''}</div>
              <span class="inline-block px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-mono text-[10px] font-semibold">${f.tier}</span>
              ${distBadge}
            </div>
          `);

          markersLayer.addLayer(marker);
        }

        const card = document.createElement('div');
        card.className = "p-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-lg cursor-pointer transition shadow-xs";
        
        const distLabel = f.distanceKm !== undefined ? `<span class="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">${f.distanceKm} km</span>` : '';

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h2 class="text-xs font-semibold text-slate-800 leading-tight mb-1">${f.name}</h2>
            ${distLabel}
          </div>
          <p class="text-[11px] text-slate-500 mb-2">${f.address?.district || ''}, ${f.address?.state || ''}</p>
          <div class="flex items-center space-x-1">
            <span class="text-[10px] font-mono px-1.5 py-0.5 bg-slate-100 rounded text-slate-600 border border-slate-200">${f.tier}</span>
            <span class="text-[10px] font-mono px-1.5 py-0.5 bg-emerald-50 text-emerald-700 rounded border border-emerald-200">${f.administration}</span>
          </div>
        `;

        card.addEventListener('click', () => {
          if (coords?.lat && coords?.lng) {
            map.flyTo([coords.lat, coords.lng], 13, { duration: 1.2 });
          }
        });

        listContainer.appendChild(card);
      });
    }

    // Geocode user input (Any town, village, or district in India)
    async function searchGeocodeLocation(query) {
      const banner = document.getElementById('status-banner');
      const statusText = document.getElementById('status-text');
      
      banner.classList.remove('hidden');
      statusText.textContent = `Searching location "${query}"...`;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&q=${encodeURIComponent(query)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          const displayName = data[0].display_name.split(',')[0];

          currentAnchorPoint = { lat, lng, name: displayName };
          
          if (searchTargetMarker) map.removeLayer(searchTargetMarker);

          searchTargetMarker = L.marker([lat, lng], {
            icon: L.divIcon({
              className: 'custom-pin',
              html: `<div class="w-6 h-6 bg-blue-600 border-2 border-white rounded-full flex items-center justify-center text-white text-xs shadow-lg font-bold animate-bounce">📍</div>`,
              iconSize: [24, 24],
              iconAnchor: [12, 24]
            })
          }).addTo(map);

          searchTargetMarker.bindPopup(`<strong>Searched: ${displayName}</strong><br><span class="text-xs text-slate-500">Ranking nearest facilities...</span>`).openPopup();
          
          map.flyTo([lat, lng], 10, { duration: 1.5 });
          statusText.textContent = `Showing nearest options to "${displayName}"`;

          applyFilters();
        } else {
          // Direct fallback to string matching if geocoding returns empty
          applyFilters();
          statusText.textContent = `Filtered by text match: "${query}"`;
        }
      } catch (err) {
        console.error("Geocoding failed, falling back to text search", err);
        applyFilters();
      }
    }

    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const zone = document.getElementById('zone-filter').value;
      const tier = document.getElementById('tier-filter').value;

      let filtered = allFacilities.map(f => {
        let copy = { ...f };
        if (currentAnchorPoint) {
          copy.distanceKm = calculateDistanceKm(currentAnchorPoint.lat, currentAnchorPoint.lng, f.coordinates.lat, f.coordinates.lng);
        } else {
          delete copy.distanceKm;
        }
        return copy;
      });

      filtered = filtered.filter(f => {
        const matchesZone = !zone || f.zone === zone;
        const matchesTier = !tier || f.tier === tier;

        if (currentAnchorPoint) {
          return matchesZone && matchesTier;
        }

        const matchesQuery = !q || 
          (f.name && f.name.toLowerCase().includes(q)) ||
          (f.address?.state && f.address.state.toLowerCase().includes(q)) ||
          (f.address?.district && f.address.district.toLowerCase().includes(q)) ||
          (f.address?.pincode && f.address.pincode.includes(q));

        return matchesQuery && matchesZone && matchesTier;
      });

      // Sort by proximity if a location anchor is active
      if (currentAnchorPoint) {
        filtered.sort((a, b) => a.distanceKm - b.distanceKm);
      }

      renderFacilities(filtered);
    }

    // Geolocation API (GPS)
    document.getElementById('gps-btn').addEventListener('click', () => {
      const banner = document.getElementById('status-banner');
      const statusText = document.getElementById('status-text');

      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      banner.classList.remove('hidden');
      statusText.textContent = "Acquiring GPS location...";

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          currentAnchorPoint = { lat, l
