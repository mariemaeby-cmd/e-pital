<script>
(() => {
  const DISTRICT_GEO_MAP = {
    "gulbarga": [17.3297, 76.8343],
    "kalaburagi": [17.3297, 76.8343],
    "wadi": [17.0483, 76.9934],
    "shahabad": [17.1332, 76.9388],
    "chittapur": [17.1186, 77.0864],
    "bidar": [17.9104, 77.5199],
    "raichur": [16.2120, 77.3439],
    "yadgir": [16.7639, 77.1378],
    "warangal": [17.9689, 79.5941],
    "nizamabad": [18.6725, 78.0941],
    "hyderabad": [17.3850, 78.4867],
    "nagole": [17.3753, 78.5637],
    "bengaluru": [12.9716, 77.5946],
    "bangalore": [12.9716, 77.5946]
  };

  function applyCoordinates(list) {
    if (!Array.isArray(list)) return;
    list.forEach(item => {
      const target = `${item.name || ''} ${item.district || ''} ${item.address || ''}`.toLowerCase();
      for (const [key, coords] of Object.entries(DISTRICT_GEO_MAP)) {
        if (target.includes(key)) {
          item.lat = coords[0] + (Math.random() - 0.5) * 0.01;
          item.lng = coords[1] + (Math.random() - 0.5) * 0.01;
          break;
        }
      }
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    if (typeof facilities !== "undefined") applyCoordinates(facilities);
    if (typeof allFacilities !== "undefined") applyCoordinates(allFacilities);
    if (typeof window.facilities !== "undefined") applyCoordinates(window.facilities);
  });
})();
</script>
