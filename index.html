  <main class="max-w-4xl mx-auto p-3 space-y-3">
    
    <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-xs overflow-hidden">

    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-xs space-y-2 relative">
      <div class="relative flex space-x-1.5">
        <div class="relative flex-1">
          <input
            id="location-input"
            type="text"

          />
          <button

            class="hidden absolute right-2 top-2.5 text-xs text-slate-400 hover:text-slate-700 font-bold px-1"

            ✕

        </div>

        <button
          id="search-btn"
          class="px-3.5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-xs shrink-0 transition"
        >

      </div>
    </div>

    <div id="facility-list" class="space-y-2.5"></div>

  </main>

      "Chandigarh": { code: "CH", zone: "NORTH", central: 1, stateHosp: 0, disp: 5, lat: 30.7333, lng: 76.7794, cities: ["Chandigarh"] },
      "Puducherry": { code: "PY", zone: "SOUTH", central: 0, stateHosp: 1, disp: 14, lat: 11.9416, lng: 79.8083, cities: ["Puducherry"] },
      "Meghalaya": { code: "ML", zone: "NORTH_EAST", central: 0, stateHosp: 0, disp: 3, lat: 25.5788, lng: 91.8933, cities: ["Shillong"] },
      "Tripura": { code: "TR", zone: "NORTH_EAST", central: 0, stateHosp: 0, disp: 2, lat: 23.8315, lng: 91.2868, cities: ["Agartala"] }
    };

    function generateFacilities() {
      const list = [];
      for (const [state, meta] of Object.entries(STATE_MATRIX)) {
        const cities = meta.cities || [state];
        
        for (let i = 1; i <= meta.central; i++) {
          const city = cities[(i - 1) % cities.length];
          list.push({
            id: `ESIC-${meta.code}-${i}`,
            name: i === 1 ? `ESIC Medical College & PGIMSR, ${city}` : `ESIC Model Hospital, ${city}`,
            city: city,
            state: state,
            lat: +(meta.lat + (i * 0.012)).toFixed(4),
            lng: +(meta.lng + (i * 0.010)).toFixed(4),
            tier: "TERTIARY"
          });
        }

        for (let i = 1; i <= meta.stateHosp; i++) {
          const city = cities[i % cities.length];
          list.push({
            id: `ESIS-${meta.code}-${i}`,
            name: `ESIS Hospital, ${city}`,
            city: city,
            state: state,
            lat: +(meta.lat - (i * 0.014)).toFixed(4),
            lng: +(meta.lng + (i * 0.012)).toFixed(4),
            tier: "SECONDARY"
          });
        }

        for (let i = 1; i <= meta.disp; i++) {
          const city = cities[i % cities.length];
          list.push({
            id: `ESID-${meta.code}-${i}`,
            name: `ESI Dispensary, ${city} - Unit ${((i % 5) + 1)}`,
            city: city,
            state: state,
            lat: +(meta.lat + ((i % 25) * 0.007) - 0.08).toFixed(4),
            lng: +(meta.lng + ((i % 25) * 0.008) - 0.08).toFixed(4),
            tier: "PRIMARY"
          });
        }

        const sstCount = Math.floor(meta.disp * 0.45);
        for (let i = 1; i <= sstCount; i++) {
          const city = cities[i % cities.length];
          list.push({
            id: `SST-${meta.code}-${i}`,
            name: `Empanelled SST Center, ${city} #${i}`,
            city: city,
            state: state,
            lat: +(meta.lat + ((i % 15) * 0.011)).toFixed(4),
            lng: +(meta.lng - ((i % 15) * 0.007)).toFixed(4),
            tier: "SUPER_SPECIALTY"
          });
        }
      }
      return list;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const dLat = (lat2 - lat1) * 0.017453292519943295;
      const dLon = (lon2 - lon1) * 0.017453292519943295;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * 0.017453292519943295) * Math.cos(lat2 * 0.017453292519943295) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return +(6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    function initMap() {
      map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([20.5937, 78.9629], 5);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
    }

    function render(list) {
      markersLayer.clearLayers();
      const listContainer = document.getElementById('facility-list');
      const countLabel = document.getElementById('results-count');
      listContainer.innerHTML = '';

      countLabel.textContent = currentAnchorPoint 
        ? `Showing closest facilities to ${currentAnchorPoint.name}`
        : `Showing ${list.length.toLocaleString()} facilities across India`;

      // 1. Draw points on the map
      const mapLimit = Math.min(list.length, 80);
      for (let i = 0; i < mapLimit; i++) {
        const f = list[i];
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;
        const distBadge = f.distanceKm !== undefined ? `<div class="text-emerald-700 font-bold text-[11px] mt-1">📍 ${f.distanceKm} km away</div>` : '';

        const circle = L.circleMarker([f.lat, f.lng], {
          radius: f.tier === 'TERTIARY' ? 6 : 4,
          fillColor: f.tier === 'TERTIARY' ? '#ef4444' : (f.tier === 'SUPER_SPECIALTY' ? '#8b5cf6' : (f.tier === 'SECONDARY' ? '#f59e0b' : '#10b981')),
          color: '#ffffff',
          weight: 1,
          fillOpacity: 0.85
        });

        circle.bindPopup(`
          <div class="text-xs p-1">
            <strong class="text-slate-900 block font-semibold text-xs mb-0.5">${f.name}</strong>
            <div class="text-slate-600 mb-1">${f.city}, ${f.state}</div>
            <span class="inline-block px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-mono text-[9px] font-semibold">${f.tier}</span>
            ${distBadge}
            <a href="${gmapsUrl}" target="_blank" rel="noopener" class="mt-2 block text-center py-1.5 px-2 bg-blue-600 text-white rounded text-[10px] font-medium">
              🚗 Navigate in Google Maps
            </a>
          </div>
        `);
        markersLayer.addLayer(circle);
      }

      // 2. Render Cards (First 35 items)
      const cardLimit = Math.min(list.length, 35);
      const frag = document.createDocumentFragment();

      for (let i = 0; i < cardLimit; i++) {
        const f = list[i];
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;
        const distBadge = f.distanceKm !== undefined 
          ? `<span class="text-xs font-black text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">📍 ${f.distanceKm} km</span>`
          : '';

        const card = document.createElement('div');
        card.className = "p-3.5 bg-white border border-slate-200 rounded-xl shadow-xs space-y-2.5";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <h2 class="text-xs font-bold text-slate-800 leading-snug cursor-pointer hover:text-emerald-600">${f.name}</h2>
              <p class="text-[11px] text-slate-500 mt-0.5">${f.city}, ${f.state}</p>
            </div>
            <div class="flex flex-col items-end gap-1 shrink-0">
              <span class="text-[10px] font-mono px-2 py-0.5 bg-slate-100 text-slate-700 rounded border border-slate-200 font-semibold">${f.tier}</span>
              ${distBadge}
            </div>
          </div>

          <a href="${gmapsUrl}" target="_blank" rel="noopener" class="w-full flex items-center justify-center gap-1.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition shadow-xs">
            <span>🚗</span> Navigate in Google Maps
          </a>
        `;

        card.querySelector('h2').addEventListener('click', () => {
          map.flyTo([f.lat, f.lng], 13, { duration: 0.8 });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        frag.appendChild(card);
      }
      listContainer.appendChild(frag);
    }

    // Set Anchor Location and Sort ALWAYS by Proximity
    function setLocationAnchor(lat, lng, label) {
      currentAnchorPoint = { lat, lng, name: label };

      const badge = document.getElementById('active-anchor-badge');
      badge.textContent = `📍 Nearest to: ${label}`;
      badge.classList.remove('hidden');
      document.getElementById('clear-btn').classList.remove('hidden');

      if (searchPin) map.removeLayer(searchPin);
      searchPin = L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'pin',
          html: `<div class="w-6 h-6 bg-blue-600 text-white rounded-full border-2 border-white flex items-center justify-center text-xs shadow-md font-bold animate-bounce">📍</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 24]
        })
      }).addTo(map);

      map.flyTo([lat, lng], 10, { duration: 0.8 });

      // Calculate distance to all facilities and rank closest first
      let ranked = allFacilities.map(f => ({
        ...f,
        distanceKm: calculateDistance(lat, lng, f.lat, f.lng)
      }));

      ranked.sort((a, b) => a.distanceKm - b.distanceKm);
      render(ranked);
    }

    // Geocode Location on Demand
    async function executeSearch(query) {
      const q = query.trim();
      if (!q) return;

      const normalized = q.toLowerCase();

      // 1. Check local cache first
      if (LOCAL_GEO_CACHE[normalized]) {
        const hit = LOCAL_GEO_CACHE[normalized];
        setLocationAnchor(hit.lat, hit.lng, hit.name);
        return;
      }

      // 2. Query OSM / Nominatim for ANY location across India
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&limit=1&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          const name = data[0].display_name.split(',')[0];
          setLocationAnchor(lat, lng, name);
          return;
        }
      } catch (e) {}

      // 3. Fallback: string matching if geocoding is unavailable
      const filtered = allFacilities.filter(f => 
        f.city.toLowerCase().includes(normalized) || 
        f.state.toLowerCase().includes(normalized) || 
        f.name.toLowerCase().includes(normalized)
      );

      if (filtered.length > 0) {
        setLocationAnchor(filtered[0].lat, filtered[0].lng, filtered[0].city);
      } else {
        render(allFacilities);
      }
    }

    // Auto-complete suggestions
    async function fetchSuggestions(query) {
      const box = document.getElementById('suggestions-box');
      if (!query || query.length < 2) {
        box.classList.add('hidden');
        return;
      }

      try {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5&lat=20.5937&lon=78.9629`);
        const data = await res.json();

        if (data.features && data.features.length > 0) {
          box.innerHTML = '';
          data.features.forEach(f => {
            const props = f.properties;
            const title = props.name || '';
            const subtitle = [props.city || props.district, props.state].filter(Boolean).join(', ');
            const coords = f.geometry.coordinates;

            const item = document.createElement('div');
            item.className = "p-2.5 hover:bg-slate-50 cursor-pointer flex items-center space-x-2 text-xs";
            item.innerHTML = `
              <span class="text-slate-400">📍</span>
              <div class="flex-1 truncate">
                <span class="font-semibold text-slate-800">${title}</span>
                <span class="t
