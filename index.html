<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-pital | National ESI Healthcare Locator</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #map { height: calc(100vh - 72px); width: 100%; z-index: 10; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-hidden">

  <!-- Top Navbar -->
  <header class="h-[72px] bg-slate-900 text-white px-6 flex items-center justify-between border-b border-slate-800 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-emerald-500 rounded-lg flex items-center justify-center font-bold text-white text-lg">e</div>
      <div>
        <h1 class="text-lg font-bold tracking-tight leading-tight">e-pital</h1>
        <p class="text-xs text-slate-400">National ESI Facility Directory & Triage</p>
      </div>
    </div>
    <div id="stats-counter" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300 font-mono">
      Loading facilities...
    </div>
  </header>

  <div class="flex flex-col md:flex-row h-[calc(100vh-72px)]">
    
    <!-- Sidebar / Filters -->
    <aside class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col z-20 shadow-md h-1/2 md:h-full">
      
      <!-- Search & Controls -->
      <div class="p-4 border-b border-slate-100 space-y-3 bg-slate-50/50">
        <div>
          <input
            id="search-input"
            type="text"
            placeholder="Search by facility name, state, or district..."
            class="w-full px-3.5 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition shadow-sm"
          />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <select id="zone-filter" class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">All Zones</option>
            <option value="NORTH">North</option>
            <option value="SOUTH">South</option>
            <option value="EAST">East</option>
            <option value="WEST">West</option>
            <option value="CENTRAL">Central</option>
            <option value="NORTH_EAST">North-East</option>
          </select>

          <select id="tier-filter" class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">All Tiers</option>
            <option value="PRIMARY">Primary (Dispensary)</option>
            <option value="SECONDARY">Secondary (Hospital)</option>
            <option value="TERTIARY">Tertiary (Apex/MC)</option>
            <option value="SUPER_SPECIALTY">Super Specialty</option>
          </select>
        </div>
      </div>

      <!-- Facility List Results -->
      <div id="facility-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 custom-scrollbar p-2 space-y-2">
        <!-- Rendered items appear here -->
      </div>
    </aside>

    <!-- Map Canvas -->
    <main class="flex-1 relative h-1/2 md:h-full">
      <div id="map"></div>
    </main>
  </div>

  <script>
    let map;
    let markersLayer = L.layerGroup();
    let allFacilities = [];

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([20.5937, 78.9629], 5);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      markersLayer.addTo(map);
    }

    async function loadData() {
      const statsCounter = document.getElementById('stats-counter');
      const candidatePaths = [
        './facilities.json',
        './data/facilities.json',
        'facilities.json',
        'data/facilities.json',
        '/e-pital/facilities.json',
        '/e-pital/data/facilities.json'
      ];

      let dataLoaded = false;

      for (const path of candidatePaths) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            allFacilities = await res.json();
            statsCounter.textContent = `${allFacilities.length.toLocaleString()} Facilities Active`;
            renderFacilities(allFacilities);
            dataLoaded = true;
            break;
          }
        } catch (e) {
          // continue checking next fallback path
        }
      }

      if (!dataLoaded) {
        statsCounter.textContent = 'Failed to load dataset';
        document.getElementById('facility-list').innerHTML = `
          <div class="p-4 text-center text-xs text-rose-600 bg-rose-50 rounded-lg border border-rose-200 m-2">
            Could not locate <code>facilities.json</code>. Ensure the file is saved and committed to the repository root.
          </div>`;
      }
    }

    function renderFacilities(list) {
      markersLayer.clearLayers();
      const listContainer = document.getElementById('facility-list');
      listContainer.innerHTML = '';

      if (list.length === 0) {
        listContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No matching facilities found.</div>`;
        return;
      }

      const renderLimit = list.slice(0, 500);

      renderLimit.forEach(f => {
        const coords = f.coordinates;
        if (coords && coords.lat && coords.lng) {
          const marker = L.circleMarker([coords.lat, coords.lng], {
            radius: f.tier === 'TERTIARY' ? 7 : 5,
            fillColor: f.tier === 'TERTIARY' ? '#ef4444' : f.tier === 'SECONDARY' ? '#f59e0b' : '#10b981',
            color: '#ffffff',
            weight: 1.5,
            opacity: 1,
            fillOpacity: 0.85
          });

          marker.bindPopup(`
            <div class="text-xs p-1">
              <strong class="text-slate-900 block font-semibold text-sm mb-1">${f.name || 'ESI Facility'}</strong>
              <div class="text-slate-600 mb-1">${f.address ? `${f.address.street || ''}, ${f.address.district || ''}` : ''}</div>
              <span class="inline-block px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-mono text-[10pt] font-semibold">${f.tier || 'FACILITY'}</span>
            </div>
          `);

          markersLayer.addLayer(marker);
        }

        const card = document.createElement('div');
        card.className = "p-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-lg cursor-pointer transition shadow-xs";
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <h2 class="text-xs font-semibold text-slate-800 leading-tight mb-1">${f.name || 'ESI Facility'}</h2>
          </div>
          <p class="text-[11px] text-slate-500 mb-2">${f.address?.district || ''}, ${f.address?.state || ''}</p>
          <div class="flex items-center space-x-1">
            <span class="text-[10px] font-mono px-1.5 py-0.5 bg-slate-100 rounded text-slate-600 border border-slate-200">${f.tier || 'GENERAL'}</span>
            <span class="text-[10px] font-mono px-1.5 py-0.5 bg-emerald-50 text-emerald-700 rounded border border-emerald-200">${f.administration || 'ESIC'}</span>
          </div>
        `;

        card.addEventListener('click', () => {
          if (coords?.lat && coords?.lng) {
            map.flyTo([coords.lat, coords.lng], 13, { duration: 1.5 });
          }
        });

        listContainer.appendChild(card);
      });
    }

    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const zone = document.getElementById('zone-filter').value;
      const tier = document.getElementById('tier-filter').value;

      const filtered = allFacilities.filter(f => {
        const matchesQuery = !q || 
          (f.name && f.name.toLowerCase().includes(q)) ||
          (f.address?.state && f.address.state.toLowerCase().includes(q)) ||
          (f.address?.district && f.address.district.toLowerCase().includes(q));

        const matchesZone = !zone || f.zone === zone;
        const matchesTier = !tier || f.tier === tier;

        return matchesQuery && matchesZone && matchesTier;
      });

      renderFacilities(filtered);
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('zone-filter').addEventListener('change', applyFilters);
    document.getElementById('tier-filter').addEventListener('change', applyFilters);

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadData();
    });
  </script>
</body>
</html>
