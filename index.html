        </div>

    </div>

    <!-- Navigation Sub-tabs -->

      <button class="py-2.5 font-medium text-slate-500 hover:text-slate-900 whitespace-nowrap">Claim Status</button>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-4 space-y-4">
    
    <!-- Directory Card & Filter Header -->
    <section class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
      <div>
        <h2 class="text-base font-bold text-slate-900">Medical Facilities Directory</h2>
        <p class="text-xs text-slate-500 mt-0.5 leading-relaxed">
          Search ESIC Medical Colleges, State ESIS Hospitals, and Empanelled Super Specialty Centers.
        </p>
      </div>

      <!-- SST Quick Toggle -->
      <button 
        id="sst-toggle-btn"
        onclick="toggleSSTOnly()"
        class="w-full bg-white border border-slate-300 text-slate-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-slate-50 active:bg-slate-100 transition flex items-center justify-center gap-2"
      >
        <span>Empanelled SST Hospitals Only</span>
      </button>

      <!-- Input: Hospital / Specialty -->
      <div>
        <input 
          id="search-name"
          type="text" 
          placeholder="Search hospital name, department, or procedure..." 
          class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800"
          oninput="filterData()"
        />
      </div>

      <!-- Input: City / State -->
      <div>
        <input 
          id="search-location"
          type="text" 
          placeholder="Filter by City, State, or Area..." 
          class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800"
          oninput="filterData()"
        />
      </div>

      <!-- Facility Type Dropdown -->
      <div>
        <select 
          id="tier-select"
          onchange="filterData()"
          class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-700 font-medium focus:outline-none focus:border-slate-800"
        >
          <option value="ALL">All Facility Types</option>
          <option value="TIER_3">ESIC / ESIS Tertiary & Apex Hospitals</option>
          <option value="TIER_4">Empanelled SST Hospitals (Tie-Ups)</option>
          <option value="TIER_1">Tier 1 Primary Dispensaries (DCBO)</option>
        </select>
      </div>
    </section>

    <!-- Counter -->
    <div class="flex items-center justify-between px-1">
      <span id="result-count" class="text-xs text-slate-500 font-semibold"></span>
      <span class="text-[11px] text-emerald-700 font-medium bg-emerald-50 border border-emerald-200/60 px-2 py-0.5 rounded-md">Sec 59(1) Active</span>
    </div>

    <!-- Facility Results List -->
    <div id="facility-list" class="space-y-3"></div>

  </main>

    let sstOnly = false;

    function toggleSSTOnly() {
      sstOnly = !sstOnly;
      const btn = document.getElementById('sst-toggle-btn');
      if (sstOnly) {
        btn.className = "w-full bg-slate-900 border border-slate-900 text-white py-2.5 rounded-xl text-xs font-semibold shadow-sm flex items-center justify-center gap-2";
      } else {
        btn.className = "w-full bg-white border border-slate-300 text-slate-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-slate-50 transition flex items-center justify-center gap-2";
      }
      filterData();
    }

    function filterData() {
      const qName = document.getElementById('search-name').value.toLowerCase().trim();
      const qLoc = document.getElementById('search-location').value.toLowerCase().trim();
      const tierVal = document.getElementById('tier-select').value;
      const list = document.getElementById('facility-list');
      list.innerHTML = '';

      const filtered = facilities.filter(f => {
        if (sstOnly && !f.isSST) return false;
        if (tierVal !== 'ALL' && f.tier !== tierVal) return false;

        const matchesName = !qName || 
          f.name.toLowerCase().includes(qName) || 
          f.category.toLowerCase().includes(qName) ||
          f.specialties.some(s => s.toLowerCase().includes(qName));

        const matchesLoc = !qLoc || 
          f.district.toLowerCase().includes(qLoc) || 
          f.state.toLowerCase().includes(qLoc) || 
          f.address.toLowerCase().includes(qLoc);

        return matchesName && matchesLoc;
      });

      document.getElementById('result-count').innerText = `Showing ${filtered.length} Facilities`;

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-500 text-xs">
            No medical facilities match your criteria.
          </div>
        `;
        return;
      }

      filtered.forEach(f => {
        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-2.5";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <span class="text-[11px] font-medium bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md border border-slate-200/60">
              ${f.category}
            </span>
            <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold text-emerald-800 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200/60 whitespace-nowrap">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span> 24x7 Emergency
            </span>
          </div>

          <div>
            <h3 class="text-sm font-bold text-slate-900 leading-snug flex items-center gap-1">
              ${f.name}
              <span class="text-slate-400 font-normal">→</span>
            </h3>
            <p class="text-xs text-slate-500 mt-1 flex items-start gap-1">
              <span>📍</span> <span>${f.address}</span>
            </p>
          </div>

          <div class="flex flex-wrap gap-1 pt-0.5">
            ${f.specialties.map(s => `
              <span class="text-[10px] font-medium bg-slate-50 text-slate-600 border border-slate-200 px-2 py-0.5 rounded">
                ${s}
              </span>
            `).join('')}
          </div>

          <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
            <span class="text-[11px] text-slate-400 font-mono">ID: ${f.id}</span>
            <a href="tel:${f.emergency}" class="font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1">
              📞 Call ${f.emergency}
            </a>
          </div>
        `;
        list.appendChild(card);
      });
    }

    filterData();
  </script>
