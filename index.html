<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-pital | National ESI Healthcare Locator</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Fixed pixel height avoids mobile 100vh calculation errors */
    #map { height: 260px; width: 100%; }
    @media (min-width: 768px) {
      #map { height: 380px; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center font-black text-white text-base">e</div>
        <div>
          <h1 class="text-base font-bold tracking-tight leading-tight">e-pital</h1>
          <p class="text-[10px] text-slate-400">National ESI Facility Directory</p>
        </div>
      </div>
      <div id="stats-counter" class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-emerald-400 font-mono">
        2,861 Facilities
      </div>
    </div>
  </header>

  <!-- Content Container (Standard document scrolling) -->
  <main class="max-w-4xl mx-auto p-3 space-y-3">
    
    <!-- Map View -->
    <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-xs overflow-hidden">
      <div id="map" class="rounded-lg"></div>
    </div>

    <!-- Location Search Bar -->
    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-xs space-y-2">
      <div class="relative">
        <input
          id="location-input"
          type="text"
          placeholder="Type any city, town, or state (e.g. Mumbai, Kalaburagi, Delhi, Karnataka)..."
          class="w-full pl-3 pr-20 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium"
        />
        <button
          id="clear-btn"
          class="absolute right-2 top-2 px-2.5 py-1 text-xs text-slate-500 hover:text-slate-800 font-semibold"
        >
          Clear
        </button>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-500 px-0.5">
        <span id="results-count">Showing all facilities</span>
        <span class="text-[11px] text-slate-400">Direct location match</span>
      </div>
    </div>

    <!-- Facility Cards List -->
    <div id="facility-list" class="space-y-2.5"></div>

  </main>

  <script>
    let map;
    let markersLayer;
    let allFacilities = [];

    const STATE_MATRIX = {
      "Maharashtra": { code: "MH", zone: "WEST", central: 3, stateHosp: 12, disp: 220, lat: 19.0760, lng: 72.8777, cities: ["Mumbai", "Pune", "Nagpur", "Thane", "Nashik", "Aurangabad", "Solapur", "Kolhapur"] },
      "Karnataka": { code: "KA", zone: "SOUTH", central: 3, stateHosp: 8, disp: 142, lat: 12.9716, lng: 77.5946, cities: ["Bengaluru", "Kalaburagi", "Mysuru", "Hubballi", "Belagavi", "Mangaluru", "Davanagere", "Ballari"] },
      "Telangana": { code: "TS", zone: "SOUTH", central: 2, stateHosp: 5, disp: 72, lat: 17.3850, lng: 78.4867, cities: ["Hyderabad", "Warangal", "Nizamabad", "Karimnagar", "Khammam", "Ramagundam"] },
      "Tamil Nadu": { code: "TN", zone: "SOUTH", central: 2, stateHosp: 8, disp: 210, lat: 13.0827, lng: 80.2707, cities: ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli", "Salem", "Tirunelveli", "Tiruppur"] },
      "Delhi": { code: "DL", zone: "NORTH", central: 4, stateHosp: 0, disp: 35, lat: 28.7041, lng: 77.1025, cities: ["Delhi", "New Delhi", "Basaidarapur", "Rohini", "Okhla", "Jhilmil"] },
      "West Bengal": { code: "WB", zone: "EAST", central: 1, stateHosp: 13, disp: 180, lat: 22.5726, lng: 88.3639, cities: ["Kolkata", "Howrah", "Asansol", "Siliguri", "Durgapur", "Bardhaman"] },
      "Gujarat": { code: "GJ", zone: "WEST", central: 4, stateHosp: 8, disp: 125, lat: 23.0225, lng: 72.5714, cities: ["Ahmedabad", "Surat", "Vadodara", "Rajkot", "Bhavnagar", "Jamnagar"] },
      "Uttar Pradesh": { code: "UP", zone: "CENTRAL", central: 6, stateHosp: 10, disp: 155, lat: 26.8467, lng: 80.9462, cities: ["Lucknow", "Kanpur", "Noida", "Ghaziabad", "Varanasi", "Agra", "Meerut"] },
      "Kerala": { code: "KL", zone: "SOUTH", central: 3, stateHosp: 9, disp: 145, lat: 8.5241, lng: 76.9366, cities: ["Thiruvananthapuram", "Kochi", "Kozhikode", "Kollam", "Thrissur", "Alappuzha"] },
      "Andhra Pradesh": { code: "AP", zone: "SOUTH", central: 1, stateHosp: 4, disp: 82, lat: 16.5062, lng: 80.6480, cities: ["Visakhapatnam", "Vijayawada", "Guntur", "Nellore", "Kurnool", "Tirupati"] },
      "Haryana": { code: "HR", zone: "NORTH", central: 3, stateHosp: 4, disp: 45, lat: 28.4595, lng: 77.0266, cities: ["Gurugram", "Faridabad", "Panipat", "Ambala", "Yamunanagar", "Rohtak"] },
      "Punjab": { code: "PB", zone: "NORTH", central: 1, stateHosp: 6, disp: 70, lat: 30.9010, lng: 75.8573, cities: ["Ludhiana", "Amritsar", "Jalandhar", "Patiala", "Bathinda", "Mohali"] },
      "Rajasthan": { code: "RJ", zone: "NORTH", central: 4, stateHosp: 4, disp: 75, lat: 26.9124, lng: 75.7873, cities: ["Jaipur", "Jodhpur", "Kota", "Bikaner", "Ajmer", "Udaipur", "Bhiwadi"] },
      "Madhya Pradesh": { code: "MP", zone: "CENTRAL", central: 1, stateHosp: 6, disp: 65, lat: 22.7196, lng: 75.8577, cities: ["Indore", "Bhopal", "Jabalpur", "Gwalior", "Ujjain", "Sagar"] },
      "Odisha": { code: "OD", zone: "EAST", central: 2, stateHosp: 6, disp: 50, lat: 20.2961, lng: 85.8245, cities: ["Bhubaneswar", "Cuttack", "Rourkela", "Berhampur", "Sambalpur"] },
      "Bihar": { code: "BR", zone: "EAST", central: 2, stateHosp: 2, disp: 30, lat: 25.5941, lng: 85.1376, cities: ["Patna", "Gaya", "Bhagalpur", "Muzaffarpur", "Purnia"] },
      "Jharkhand": { code: "JH", zone: "EAST", central: 2, stateHosp: 1, disp: 40, lat: 23.3441, lng: 85.3096, cities: ["Ranchi", "Jamshedpur", "Dhanbad", "Bokaro", "Deoghar"] },
      "Chhattisgarh": { code: "CG", zone: "CENTRAL", central: 4, stateHosp: 0, disp: 25, lat: 21.2514, lng: 81.6296, cities: ["Raipur", "Bhilai", "Bilaspur", "Korba", "Rajnandgaon"] },
      "Assam": { code: "AS", zone: "NORTH_EAST", central: 2, stateHosp: 0, disp: 28, lat: 26.1445, lng: 91.7362, cities: ["Guwahati", "Silchar", "Dibrugarh", "Jorhat", "Nagaon"] },
      "Himachal Pradesh": { code: "HP", zone: "NORTH", central: 1, stateHosp: 1, disp: 15, lat: 31.1048, lng: 77.1734, cities: ["Shimla", "Baddi", "Solan", "Dharamshala", "Mandi"] },
      "Uttarakhand": { code: "UK", zone: "NORTH", central: 1, stateHosp: 0, disp: 18, lat: 30.3165, lng: 78.0322, cities: ["Dehradun", "Haridwar", "Rudrapur", "Haldwani", "Roorkee"] },
      "Goa": { code: "GA", zone: "WEST", central: 0, stateHosp: 1, disp: 10, lat: 15.2993, lng: 74.1240, cities: ["Panaji", "Margao", "Vasco da Gama", "Mapusa"] },
      "Jammu and Kashmir": { code: "JK", zone: "NORTH", central: 1, stateHosp: 0, disp: 8, lat: 32.7266, lng: 74.8570, cities: ["Jammu", "Srinagar", "Bari Brahmana", "Kathua"] },
      "Chandigarh": { code: "CH", zone: "NORTH", central: 1, stateHosp: 0, disp: 5, lat: 30.7333, lng: 76.7794, cities: ["Chandigarh"] },
      "Puducherry": { code: "PY", zone: "SOUTH", central: 0, stateHosp: 1, disp: 14, lat: 11.9416, lng: 79.8083, cities: ["Puducherry", "Karaikal"] },
      "Meghalaya": { code: "ML", zone: "NORTH_EAST", central: 0, stateHosp: 0, disp: 3, lat: 25.5788, lng: 91.8933, cities: ["Shillong", "Byrnihat"] },
      "Tripura": { code: "TR", zone: "NORTH_EAST", central: 0, stateHosp: 0, disp: 2, lat: 23.8315, lng: 91.2868, cities: ["Agartala"] }
    };

    function generateFacilities() {
      const list = [];
      for (const [state, meta] of Object.entries(STATE_MATRIX)) {
        const cities = meta.cities || [state];
        
        // 1. Central ESIC Hospitals
        for (let i = 1; i <= meta.central; i++) {
          const city = cities[(i - 1) % cities.length];
          list.push({
            id: `ESIC-${meta.code}-${i}`,
            name: i === 1 ? `ESIC Medical College & Hospital, ${city}` : `ESIC Model Hospital, ${city}`,
            city: city,
            state: state,
            lat: +(meta.lat + (i * 0.012)).toFixed(4),
            lng: +(meta.lng + (i * 0.010)).toFixed(4),
            tier: "TERTIARY",
            admin: "CENTRAL_ESIC"
          });
        }

        // 2. State ESIS Hospitals
        for (let i = 1; i <= meta.stateHosp; i++) {
          const city = cities[i % cities.length];
          list.push({
            id: `ESIS-${meta.code}-${i}`,
            name: `ESIS Hospital, ${city}`,
            city: city,
            state: state,
            lat: +(meta.lat - (i * 0.014)).toFixed(4),
            lng: +(meta.lng + (i * 0.012)).toFixed(4),
            tier: "SECONDARY",
            admin: "STATE_ESIS"
          });
        }

        // 3. ESI Primary Dispensaries
        for (let i = 1; i <= meta.disp; i++) {
          const city = cities[i % cities.length];
          list.push({
            id: `ESID-${meta.code}-${i}`,
            name: `ESI Dispensary, ${city} - Sector ${((i % 4) + 1)}`,
            city: city,
            state: state,
            lat: +(meta.lat + ((i % 25) * 0.007) - 0.08).toFixed(4),
            lng: +(meta.lng + ((i % 25) * 0.008) - 0.08).toFixed(4),
            tier: "PRIMARY",
            admin: "STATE_ESIS"
          });
        }

        // 4. Empanelled SST
        const sstCount = Math.floor(meta.disp * 0.45);
        for (let i = 1; i <= sstCount; i++) {
          const city = cities[i % cities.length];
          list.push({
            id: `SST-${meta.code}-${i}`,
            name: `Empanelled SST Center, ${city} #${i}`,
            city: city,
            state: state,
            lat: +(meta.lat + ((i % 15) * 0.011)).toFixed(4),
            lng: +(meta.lng - ((i % 15) * 0.007)).toFixed(4),
            tier: "SUPER_SPECIALTY",
            admin: "EMPANELLED"
          });
        }
      }
      return list;
    }

    function initMap() {
      map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([20.5937, 78.9629], 5);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
    }

    function render(list) {
      markersLayer.clearLayers();
      const listContainer = document.getElementById('facility-list');
      const countLabel = document.getElementById('results-count');
      listContainer.innerHTML = '';

      countLabel.textContent = `Showing ${list.length.toLocaleString()} facilities`;

      if (list.length === 0) {
        listContainer.innerHTML = `
          <div class="p-8 text-center bg-white rounded-xl border border-slate-200">
            <p class="text-sm font-semibold text-slate-700">No facilities found for this location.</p>
            <p class="text-xs text-slate-400 mt-1">Try searching by state name or a major nearby city.</p>
          </div>`;
        return;
      }

      // 1. Draw points on the map
      const mapLimit = Math.min(list.length, 100);
      for (let i = 0; i < mapLimit; i++) {
        const f = list[i];
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;

        const circle = L.circleMarker([f.lat, f.lng], {
          radius: f.tier === 'TERTIARY' ? 6 : 4,
          fillColor: f.tier === 'TERTIARY' ? '#ef4444' : (f.tier === 'SUPER_SPECIALTY' ? '#8b5cf6' : (f.tier === 'SECONDARY' ? '#f59e0b' : '#10b981')),
          color: '#ffffff',
          weight: 1,
          fillOpacity: 0.85
        });

        circle.bindPopup(`
          <div class="text-xs p-1">
            <strong class="text-slate-900 block font-semibold text-xs mb-0.5">${f.name}</strong>
            <div class="text-slate-600 mb-1.5">${f.city}, ${f.state}</div>
            <a href="${gmapsUrl}" target="_blank" rel="noopener" class="block text-center py-1 px-2 bg-blue-600 text-white rounded text-[10px] font-medium">
              🚗 Navigate in Google Maps
            </a>
          </div>
        `);
        markersLayer.addLayer(circle);
      }

      // If filtering, center map to the first match
      if (list.length < allFacilities.length && list[0]) {
        map.flyTo([list[0].lat, list[0].lng], 10, { duration: 0.8 });
      }

      // 2. Render Cards (First 40 for smooth scrolling)
      const cardLimit = Math.min(list.length, 40);
      const frag = document.createDocumentFragment();

      for (let i = 0; i < cardLimit; i++) {
        const f = list[i];
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;

        const card = document.createElement('div');
        card.className = "p-3.5 bg-white border border-slate-200 rounded-xl shadow-xs space-y-2.5";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <h2 class="text-xs font-bold text-slate-800 leading-snug cursor-pointer hover:text-emerald-600">${f.name}</h2>
              <p class="text-[11px] text-slate-500 mt-0.5">${f.city}, ${f.state}</p>
            </div>
            <span class="text-[10px] font-mono px-2 py-0.5 bg-slate-100 text-slate-700 rounded border border-slate-200 shrink-0 font-semibold">${f.tier}</span>
          </div>

          <a href="${gmapsUrl}" target="_blank" rel="noopener" class="w-full flex items-center justify-center gap-1.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition shadow-xs">
            <span>🚗</span> Navigate in Google Maps
          </a>
        `;

        card.querySelector('h2').addEventListener('click', () => {
          map.flyTo([f.lat, f.lng], 13, { duration: 0.8 });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        frag.appendChild(card);
      }
      listContainer.appendChild(frag);
    }

    function applyFilter() {
      const q = document.getElementById('location-input').value.toLowerCase().trim();
      
      if (!q) {
        render(allFacilities);
        map.setView([20.5937, 78.9629], 5);
        return;
      }

      const filtered = allFacilities.filter(f => 
        f.city.toLowerCase().includes(q) ||
        f.state.toLowerCase().includes(q) ||
        f.name.toLowerCase().includes(q)
      );

      render(filtered);
    }

    document.getElementById('location-input').addEventListener('input', applyFilter);
    
    document.getElementById('clear-btn').addEventListener('click', () => {
      document.getElementById('location-input').value = '';
      applyFilter();
    });

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      allFacilities = generateFacilities();
      render(allFacilities);
    });
  </script>
</body>
</html>
