<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-pital | National ESI Healthcare Locator</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 flex flex-col h-screen">

  <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center z-10">
    <div>
      <h1 class="text-xl font-bold tracking-wide">e-pital</h1>
      <p class="text-xs text-blue-200">National ESI Healthcare Facility Locator</p>
    </div>
    <div class="text-right">
      <span id="facility-count" class="bg-blue-800 text-xs px-3 py-1 rounded-full font-semibold border border-blue-600">
        Loading facilities...
      </span>
    </div>
  </header>

  <div class="bg-white p-3 shadow border-b border-gray-200 z-10 flex flex-col sm:flex-row gap-2">
    <input 
      id="search-input" 
      type="text" 
      placeholder="Search facility by name, city, district, or state..." 
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
    />
    <select 
      id="tier-filter" 
      class="px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white"
    >
      <option value="">All Tiers</option>
      <option value="PRIMARY">Primary</option>
      <option value="SECONDARY">Secondary</option>
      <option value="TERTIARY">Tertiary</option>
      <option value="SUPER_SPECIALTY">Super Specialty</option>
    </select>
  </div>

  <main class="flex-1 relative">
    <div id="map" class="w-full h-full"></div>
  </main>
    <script>
    // 1. Initialize Map centered on India
    const map = L.map('map').setView([22.5937, 78.9629], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const markers = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 50
    });

    let allFacilities = [];

    // Helper function to build popup content
    function createPopupContent(facility) {
      const emergencyPhone = facility.contact?.emergency || '1800-11-2526';
      const generalPhone = facility.contact?.phone || 'N/A';
      const services = Array.isArray(facility.services) ? facility.services.join(', ') : 'General Services';

      return `
        <div class="text-sm">
          <span class="inline-block px-2 py-0.5 text-xs font-semibold rounded bg-blue-100 text-blue-800 mb-1">
            ${facility.tier || 'ESIC FACILITY'}
          </span>
          <h3 class="font-bold text-gray-900 text-base mb-1">${facility.name}</h3>
          <p class="text-gray-600 text-xs mb-2">${facility.address || ''}, ${facility.district || ''}, ${facility.state || ''}</p>
          <div class="border-t pt-2 space-y-1 text-xs">
            <div><strong>Services:</strong> ${services}</div>
            <div><strong>Phone:</strong> ${generalPhone}</div>
            <div><strong>Emergency:</strong> <a href="tel:${emergencyPhone}" class="text-red-600 font-bold">${emergencyPhone}</a></div>
          </div>
        </div>
      `;
    }

    // Render markers on the map
    function renderMarkers(data) {
      markers.clearLayers();
      
      data.forEach(facility => {
        const lat = facility.coordinates?.lat;
        const lng = facility.coordinates?.lng;

        // Geospatial validation check (India bounding box)
        if (lat && lng && lat >= 6 && lat <= 37 && lng >= 68 && lng <= 98) {
          const marker = L.marker([lat, lng]);
          marker.bindPopup(createPopupContent(facility));
          markers.addLayer(marker);
        }
      });

      map.addLayer(markers);
      document.getElementById('facility-count').textContent = `${data.length} Facilities Live`;
    }
          // 2. Fetch dataset (pointed to 3000facilities.json)
    fetch('./data/3000facilities.json')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        allFacilities = data;
        renderMarkers(allFacilities);
      })
      .catch(error => {
        console.error('Data load error:', error);
        document.getElementById('facility-count').textContent = 'Error Loading Data';
        document.getElementById('facility-count').classList.add('bg-red-700');
      });

    // 3. Search & Filter Handlers
    function applyFilters() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedTier = document.getElementById('tier-filter').value;

      const filtered = allFacilities.filter(item => {
        const matchesTier = selectedTier ? item.tier === selectedTier : true;
        const searchTarget = `${item.name || ''} ${item.district || ''} ${item.state || ''} ${item.address || ''}`.toLowerCase();
        const matchesSearch = searchTerm ? searchTarget.includes(searchTerm) : true;

        return matchesTier && matchesSearch;
      });

      renderMarkers(filtered);
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('tier-filter').addEventListener('change', applyFilters);
  </script>
</body>
</html>
