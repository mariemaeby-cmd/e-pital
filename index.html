    function buildDataset() {
      const list = [];
      const counters = {};

      for (const [st, meta] of Object.entries(STATES)) {
        const cityList = meta.cities || [st];

        for (let i = 1; i <= meta.c; i++) {
          const city = cityList[(i - 1) % cityList.length];
          const base = CITIES[city] || meta.def;
          list.push({
            id: `ESIC-${meta.code}-${i}`,
            name: i === 1 ? `ESIC Medical College & PGIMSR, ${city}` : `ESIC Model Hospital, ${city} Sector ${i}`,
            city, state: st,
            lat: +(base[0] + (i * 0.004)).toFixed(4),
            lng: +(base[1] + (i * 0.004)).toFixed(4),
            tier: "TERTIARY"
          });
        }

        for (let i = 1; i <= meta.s; i++) {
          const city = cityList[i % cityList.length];
          const base = CITIES[city] || meta.def;
          list.push({
            id: `ESIS-${meta.code}-${i}`,
            name: `ESIS General Hospital, ${city} Unit ${i}`,
            city, state: st,
            lat: +(base[0] - (i * 0.005)).toFixed(4),
            lng: +(base[1] + (i * 0.003)).toFixed(4),
            tier: "SECONDARY"
          });
        }

        for (let i = 1; i <= meta.d; i++) {
          const city = cityList[i % cityList.length];
          const base = CITIES[city] || meta.def;
          const k = `${city}_disp`;
          counters[k] = (counters[k] || 0) + 1;
          list.push({
            id: `ESID-${meta.code}-${i}`,
            name: `ESI Dispensary, ${city} - Unit ${counters[k]}`,
            city, state: st,
            lat: +(base[0] + ((i * 0.0031) % 0.06) - 0.03).toFixed(4),
            lng: +(base[1] + ((i * 0.0037) % 0.06) - 0.03).toFixed(4),
            tier: "PRIMARY"
          });
        }

        const sst = Math.floor(meta.d * 0.45);
        for (let i = 1; i <= sst; i++) {
          const city = cityList[i % cityList.length];
          const base = CITIES[city] || meta.def;
          const k = `${city}_sst`;
          counters[k] = (counters[k] || 0) + 1;
          list.push({
            id: `SST-${meta.code}-${i}`,
            name: `Empanelled SST Center, ${city} - Unit ${counters[k]}`,
            city, state: st,
            lat: +(base[0] + ((i * 0.0042) % 0.07) - 0.035).toFixed(4),
            lng: +(base[1] - ((i * 0.0039) % 0.07) + 0.035).toFixed(4),
            tier: "SUPER_SPECIALTY"
          });
        }
      }
      return list;
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const dLat = (lat2 - lat1) * 0.017453292519943295;
      const dLon = (lon2 - lon1) * 0.017453292519943295;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * 0.017453292519943295) * Math.cos(lat2 * 0.017453292519943295) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return +(6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

          fillOpacity: 0.9

        marker.bindPopup(`

            <div class="text-[#586171] mb-1">${f.city}, ${f.state}</div>
            <a href="${gmaps}" target="_blank" rel="noopener" class="mt-1 block text-center py-1 px-2 bg-emerald-800 text-white rounded text-[10px] font-medium">
              Navigate ↗
            </a>
          </div>
        `);
        markersLayer.addLayer(marker);
      }

        let badge = "bg-emerald-50 text-emerald-900 border-emerald-200";
        if (f.tier === 'TERTIARY') badge = "bg-rose-50 text-rose-900 border-rose-200";
        else if (f.tier === 'SUPER_SPECIALTY') badge = "bg-purple-50 text-purple-900 border-purple-200";
        else if (f.tier === 'SECONDARY') badge = "bg-amber-50 text-amber-900 border-amber-200";

        const card = document.createElement('div');
        card.className = "p-3.5 bg-white border border-[#E5E2DC] rounded-2xl shadow-sm hover:border-[#DBD7CE] transition relative";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 pr-10">
            <div>
              <h2 class="text-[13px] font-bold text-[#1E232A] leading-snug cursor-pointer hover:text-emerald-700 transition">${f.name}</h2>
              <p class="text-[11px] text-[#586171] font-medium mt-0.5">${f.city}, ${f.state}</p>
            </div>
          </div>
          <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-[#F4F2EC]">
            <span class="text-[10px] font-mono px-2.5 py-0.5 rounded-full border font-semibold ${badge}">${f.tier}</span>
