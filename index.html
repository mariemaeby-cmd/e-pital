<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>e-pital | National ESI Facility Directory & Proximity Navigator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet.js CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Leaflet MarkerCluster CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    #map { height: 100%; width: 100%; z-index: 10; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col h-screen overflow-hidden">

  <!-- Top Header Navigation -->
  <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shadow-md z-30 flex-shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-lg text-white shadow">
        e
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight tracking-tight">e-pital</h1>
        <p class="text-[11px] text-slate-400 leading-none">National ESI Facility Directory & Proximity Navigator</p>
      </div>
    </div>
    
    <!-- Dynamic Counter Badge -->
    <div id="statusBadge" class="text-xs px-3 py-1.5 rounded-full font-medium bg-slate-800 text-slate-300 border border-slate-700 flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="statusDot"></span>
      <span id="recordCount">Loading registry...</span>
    </div>
  </header>

  <!-- Main Dual-Pane Layout -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- Left / Top Map Container -->
    <section class="w-full md:w-3/5 h-64 md:h-full relative flex-shrink-0 border-b md:border-b-0 md:border-r border-slate-200">
      <div id="map"></div>
    </section>

    <!-- Right / Bottom Facility Explorer & Search Panel -->
    <section class="w-full md:w-2/5 flex-1 flex flex-col bg-white overflow-hidden shadow-lg z-20">
      
      <!-- Search & Filter Controls -->
      <div class="p-4 border-b border-slate-200 bg-white flex-shrink-0 space-y-3">
        <div class="relative flex items-center">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search village, taluk, town, city, or PIN..." 
            class="w-full pl-10 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition shadow-sm"
          />
          <div class="absolute left-3 text-slate-400 pointer-events-none">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <button 
            id="geolocateBtn" 
            title="Use current location" 
            class="absolute right-1.5 p-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg shadow-sm transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
          <span id="resultsCount">Showing nearest facilities</span>
          <span id="activeAnchorText" class="font-medium text-emerald-700 truncate max-w-[180px]">Center: National</span>
        </div>
      </div>

      <!-- Facility Cards List -->
      <div id="facilityList" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2.5 bg-slate-50">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>
    <script>
    // System State Variables
    let map;
    let clusterLayer;
    let facilitiesData = [];
    let userCoordinates = { lat: 17.3297, lng: 76.8343 }; // Default view anchor

    // Initialize Leaflet Map
    function initMap() {
      map = L.map('map', {
        zoomControl: true
      }).setView([userCoordinates.lat, userCoordinates.lng], 6);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      clusterLayer = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 45,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false
      });
      map.addLayer(clusterLayer);
    }

    // Great-Circle Haversine Distance Formula
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's radius in KM
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Multi-path resilient ingestion pipeline
    async function fetchRegistryData() {
      const paths = [
        'data/facilities.json',
        '/data/facilities.json',
        './data/facilities.json',
        'data/3000facilities.json',
        '/data/3000facilities.json'
      ];

      for (const p of paths) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            const raw = await res.json();
            const items = Array.isArray(raw) ? raw : (raw.facilities || raw.data || raw.records || Object.values(raw));
            if (Array.isArray(items) && items.length > 0) {
              console.log(`[e-pital] Successfully resolved ${items.length} records from ${p}`);
              return items;
            }
          }
        } catch (e) {
          // Continue attempting candidate paths
        }
      }
      throw new Error("Could not find or parse facility data file.");
    }

    // Normalization Pipeline
    function normalizeFacilities(rawArray) {
      const normalized = [];

      rawArray.forEach((item, index) => {
        if (!item || typeof item !== 'object') return;

        // Dynamic coordinate key resolution
        let rawLat = item.lat ?? item.latitude ?? item.Latitude ?? item.LAT ?? item.coordinates?.lat ?? item.geo?.lat;
        let rawLng = item.lng ?? item.lon ?? item.longitude ?? item.Longitude ?? item.LON ?? item.LNG ?? item.coordinates?.lng ?? item.coordinates?.lon ?? item.geo?.lng;

        if (item.geometry && Array.isArray(item.geometry.coordinates)) {
          rawLng = item.geometry.coordinates[0];
          rawLat = item.geometry.coordinates[1];
        }

        let lat = parseFloat(rawLat);
        let lng = parseFloat(rawLng);

        // Indian Geographic Bounding Box verification
        const validCoords = !isNaN(lat) && !isNaN(lng) && lat >= 6 && lat <= 38 && lng >= 68 && lng <= 98;
        
        // Auto-fix inverted lat/lng coordinates
        if (!validCoords && !isNaN(lat) && !isNaN(lng) && lng >= 6 && lng <= 38 && lat >= 68 && lat <= 98) {
          const temp = lat;
          lat = lng;
          lng = temp;
        } else if (!validCoords) {
          return;
        }

        // Tier classification
        let rawTier = String(item.tier || item.category || item.type || item.facility_type || '').toUpperCase();
        let normalizedTier = 'PRIMARY';
        if (rawTier.includes('SUPER') || rawTier.includes('TERTIARY') || rawTier.includes('COLLEGE')) {
          normalizedTier = 'TERTIARY';
        } else if (rawTier.includes('HOSPITAL') || rawTier.includes('SECONDARY')) {
          normalizedTier = 'SECONDARY';
        }

        // Institution name normalization
        const resolvedName = 
          item.name || 
          item.hospital_name || 
          item.facility_name || 
          item.Facility_Name || 
          item['Hospital Name'] || 
          item['Name of Institution'] || 
          `ESI Facility #${index + 1}`;

        normalized.push({
          id: item.id || item.facility_id || `ESIC-IN-${String(index + 1).padStart(4, '0')}`,
          name: String(resolvedName).trim(),
          tier: normalizedTier,
          city: item.city || item.district || item.District || item.location || 'Unknown District',
          state: item.state || item.State || 'India',
          pincode: item.pincode || item.pin || '',
          lat: lat,
          lng: lng,
          phone: item.contact?.phone || item.phone || item.contact || '1800-11-2526',
          distanceKm: 0
        });
      });

      return normalized;
    }

    // Render Leaflet Markers
    function renderMapMarkers(data) {
      clusterLayer.clearLayers();
      
      data.forEach(fac => {
        const tierColor = fac.tier === 'TERTIARY' ? '#ef4444' : (fac.tier === 'SECONDARY' ? '#3b82f6' : '#10b981');
        
        const marker = L.circleMarker([fac.lat, fac.lng], {
          radius: 7,
          fillColor: tierColor,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.85
        });

        marker.bindPopup(`
          <div class="p-1 text-slate-900 font-sans">
            <span class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded text-white" style="background-color: ${tierColor}">${fac.tier}</span>
            <h4 class="font-bold text-sm mt-1.5 leading-tight">${fac.name}</h4>
            <p class="text-xs text-slate-600 mt-1">${fac.city}, ${fac.state} ${fac.pincode ? '- ' + fac.pincode : ''}</p>
            <p class="text-xs text-slate-500 mt-0.5">📞 ${fac.phone}</p>
          </div>
        `);

        clusterLayer.addLayer(marker);
      });
    }

    // Render Facility Card List
    function renderList(data) {
      const listContainer = document.getElementById('facilityList');
      listContainer.innerHTML = '';

      if (data.length === 0) {
        listContainer.innerHTML = `
          <div class="p-8 text-center text-slate-400">
            <p class="text-sm">No facilities match your search criteria.</p>
          </div>
        `;
        return;
      }

      const displayList = data.slice(0, 50); // High-performance virtualization

      displayList.forEach(fac => {
        const badgeColor = fac.tier === 'TERTIARY' ? 'bg-red-50 text-red-700 border-red-200' : 
                           (fac.tier === 'SECONDARY' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200');

        const card = document.createElement('div');
        card.className = "p-3.5 bg-white rounded-xl border border-slate-200 hover:border-emerald-400 hover:shadow-md transition cursor-pointer flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${badgeColor}">
                ${fac.tier}
              </span>
              <span class="text-xs font-semibold text-slate-700 flex items-center gap-1">
                📍 ${fac.distanceKm.toFixed(1)} km
              </span>
            </div>
            <h3 class="font-bold text-sm text-slate-900 mt-2 leading-snug">${fac.name}</h3>
            <p class="text-xs text-slate-500 mt-1">${fac.city}, ${fac.state} ${fac.pincode ? '- ' + fac.pincode : ''}</p>
          </div>
          <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
            <span>📞 ${fac.phone}</span>
            <span class="text-emerald-600 font-semibold text-[11px] hover:underline">Focus on Map →</span>
          </div>
        `;

        card.addEventListener('click', () => {
          map.flyTo([fac.lat, fac.lng], 15, { animate: true, duration: 1.2 });
        });

        listContainer.appendChild(card);
      });

      document.getElementById('resultsCount').innerText = `Showing ${displayList.length} of ${data.length} institutions`;
    }

    // Recalculate Distance & Sort
    function updateDistances(originLat, originLng) {
      facilitiesData.forEach(fac => {
        fac.distanceKm = calculateDistance(originLat, originLng, fac.lat, fac.lng);
      });

      facilitiesData.sort((a, b) => a.distanceKm - b.distanceKm);
      applyFilter();
    }

    // Filter by Search Query
    function applyFilter() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = facilitiesData.filter(fac => {
        return fac.name.toLowerCase().includes(query) ||
               fac.city.toLowerCase().includes(query) ||
               fac.state.toLowerCase().includes(query) ||
               fac.pincode.includes(query) ||
               fac.tier.toLowerCase().includes(query);
      });

      renderList(filtered);
    }

    // Search Geocoder (Nominatim OpenStreetMap)
    async function searchLocation(queryText) {
      if (!queryText.trim()) return;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&q=${encodeURIComponent(queryText)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          userCoordinates = { lat, lng };
          map.flyTo([lat, lng], 11, { animate: true });
          document.getElementById('activeAnchorText').innerText = `Near: ${data[0].display_name.split(',')[0]}`;
          updateDistances(lat, lng);
        }
      } catch (err) {
        console.warn('Geocoding error:', err);
      }
    }

    // App Initializer
    async function initApp() {
      initMap();

      const statusBadge = document.getElementById('statusBadge');
      const statusDot = document.getElementById('statusDot');
      const recordCount = document.getElementById('recordCount');

      try {
        const raw = await fetchRegistryData();
        facilitiesData = normalizeFacilities(raw);

        if (facilitiesData.length === 0) {
          throw new Error("No valid coordinates parsed from dataset.");
        }

        // UI Header State: Connected
        statusBadge.className = "text-xs px-3 py-1.5 rounded-full font-medium bg-emerald-950 text-emerald-300 border border-emerald-800 flex items-center gap-1.5";
        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        recordCount.innerText = `${facilitiesData.length.toLocaleString()} Facilities Active`;

        // Load & Render
        updateDistances(userCoordinates.lat, userCoordinates.lng);
        renderMapMarkers(facilitiesData);

      } catch (error) {
        console.error('[e-pital] Initialization failed:', error);
        statusBadge.className = "text-xs px-3 py-1.5 rounded-full font-medium bg-red-950 text-red-300 border border-red-800 flex items-center gap-1.5";
        statusDot.className = "w-2 h-2 rounded-full bg-red-500";
        recordCount.innerText = "Fetch Failed (404/CORS)";
      }

      // Event Listeners
      document.getElementById('searchInput').addEventListener('input', applyFilter);
      document.getElementById('searchInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchLocation(e.target.value);
      });

      document.getElementById('geolocateBtn').addEventListener('click', () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              userCoordinates = { lat: latitude, lng: longitude };
              map.flyTo([latitude, longitude], 12);
              document.getElementById('activeAnchorText').innerText = "Near: My Location";
              updateDistances(latitude, longitude);
            },
            () => alert("Location permission denied. Please search your city or PIN manually.")
          );
        }
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
