
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-pital • National ESIC/ESIS Health Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">E-pital</h1>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">Sec 59(1) Active</span>
      </div>
      <p class="text-xs text-slate-400 mt-1">Pan-India ESIC, ESIS & Empanelled SST Network</p>
    </header>

    <input 
      id="search"
      type="text" 
      placeholder="Search hospital, district, or specialty..." 
      class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500"
      oninput="filterData()"
    />

    <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
      <button onclick="setTier('ALL')" id="tab-ALL" class="tier-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">All Tiers</button>
      <button onclick="setTier('TIER_1')" id="tab-TIER_1" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Dispensaries</button>
      <button onclick="setTier('TIER_3')" id="tab-TIER_3" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Apex / ESIC</button>
      <button onclick="setTier('TIER_4')" id="tab-TIER_4" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Empanelled SST</button>
    </div>

    <div id="facility-list" class="space-y-3"></div>
  </div>

  <script>
    const facilities = [
      {
        name: "ESIC Medical College & Hospital",
        tier: "TIER_3",
        tierLabel: "Tier 3 • Central Apex",
        state: "Karnataka",
        district: "Kalaburagi",
        emergency: "08472-265555",
        address: "Sedam Road, Kalaburagi - 585106",
        specialties: ["Cardiology", "Nephrology", "ICU", "Emergency 24x7"]
      },
      {
        name: "ESIC Model Hospital Rajajinagar",
        tier: "TIER_3",
        tierLabel: "Tier 3 • Central Apex",
        state: "Karnataka",
        district: "Bengaluru",
        emergency: "080-23325130",
        address: "Rajajinagar 2nd Block, Bengaluru - 560010",
        specialties: ["Dialysis", "Burn Unit", "Pediatrics", "Oncology"]
      },
      {
        name: "ESIS Hospital Worli",
        tier: "TIER_3",
        tierLabel: "Tier 3 • State ESIS",
        state: "Maharashtra",
        district: "Mumbai",
        emergency: "022-24933142",
        address: "Ganpatrao Kadam Marg, Lower Parel, Mumbai - 400013",
        specialties: ["General Surgery", "Orthopedics", "Trauma"]
      },
      {
        name: "ESIS Dispensary Peenya",
        tier: "TIER_1",
        tierLabel: "Tier 1 • Primary Dispensary",
        state: "Karnataka",
        district: "Bengaluru",
        emergency: "080-28394421",
        address: "Peenya Industrial Area Phase 1 - 560058",
        specialties: ["OPD", "Pharmacy", "Stat Referral"]
      },
      {
        name: "Apollo Hospital Bannerghatta (SST Tie-Up)",
        tier: "TIER_4",
        tierLabel: "Tier 4 • Empanelled SST",
        state: "Karnataka",
        district: "Bengaluru",
        emergency: "1066",
        address: "154/11, Opp IIMB, Bannerghatta Rd - 560076",
        specialties: ["Cashless SST", "Cardiac Bypass", "Neurosurgery"]
      }
    ];

    let currentTier = 'ALL';

    function setTier(tier) {
      currentTier = tier;
      document.querySelectorAll('.tier-tab').forEach(tab => {
        tab.className = 'tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium';
      });
      document.getElementById(`tab-${tier}`).className = 'tier-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap font-medium';
      filterData();
    }

    function filterData() {
      const q = document.getElementById('search').value.toLowerCase();
      const list = document.getElementById('facility-list');
      list.innerHTML = '';

      const filtered = facilities.filter(f => {
        const matchesTier = (currentTier === 'ALL' || f.tier === currentTier);
        const matchesQuery = f.name.toLowerCase().includes(q) || 
                             f.district.toLowerCase().includes(q) || 
                             f.state.toLowerCase().includes(q) ||
                             f.specialties.some(s => s.toLowerCase().includes(q));
        return matchesTier && matchesQuery;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">No facilities match your search.</div>`;
        return;
      }

      filtered.forEach(f => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2 shadow-sm";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <h3 class="text-sm font-semibold text-slate-100">${f.name}</h3>
            <span class="text-[10px] bg-slate-800 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-md">${f.tierLabel}</span>
          </div>
          <p class="text-xs text-slate-400">${f.address}</p>
          <div class="flex flex-wrap gap-1 pt-1">
            ${f.specialties.map(s => `<span class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">${s}</span>`).join('')}
          </div>
          <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
            <a href="tel:${f.emergency}" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-2.5 py-1 rounded-lg">
              📞 ${f.emergency}
            </a>
            <span class="text-[11px] text-slate-400">${f.district}, ${f.state}</span>
          </div>
        `;
        list.appendChild(card);
      });
    }

    filterData();
  </script>
</body>
</html>
