<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-pital • Pan-India ESIC/ESIS Health Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">E-pital</h1>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">Sec 59(1) Active</span>
      </div>
      <p class="text-xs text-slate-400 mt-1">Pan-India ESIC, ESIS & Empanelled SST Directory</p>
    </header>

    <!-- Search Input -->
    <div>
      <input 
        id="search"
        type="text" 
        placeholder="Search hospital, zone, state, specialty..." 
        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500"
        oninput="filterData()"
      />
    </div>

    <!-- Zone Filter Pills -->
    <div>
      <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold px-1">Zones</span>
      <div class="flex gap-2 overflow-x-auto pb-1 mt-1 text-xs">
        <button onclick="setZone('ALL')" id="zone-ALL" class="zone-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">All Zones</button>
        <button onclick="setZone('South')" id="zone-South" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">South</button>
        <button onclick="setZone('North')" id="zone-North" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">North</button>
        <button onclick="setZone('West')" id="zone-West" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">West</button>
        <button onclick="setZone('East')" id="zone-East" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">East</button>
        <button onclick="setZone('Central India')" id="zone-Central India" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Central</button>
        <button onclick="setZone('North East')" id="zone-North East" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">North East</button>
      </div>
    </div>

    <!-- Tier Filter Tabs -->
    <div>
      <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold px-1">Facility Tiers</span>
      <div class="flex gap-2 overflow-x-auto pb-1 mt-1 text-xs">
        <button onclick="setTier('ALL')" id="tab-ALL" class="tier-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">All Tiers</button>
        <button onclick="setTier('TIER_1')" id="tab-TIER_1" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Tier 1 • Dispensaries</button>
        <button onclick="setTier('TIER_3')" id="tab-TIER_3" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Tier 3 • Apex / ESIC</button>
        <button onclick="setTier('TIER_4')" id="tab-TIER_4" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Tier 4 • Empanelled SST</button>
      </div>
    </div>

    <!-- Live Counter -->
    <div id="result-count" class="text-xs text-slate-400 px-1 font-medium"></div>

    <!-- Facility Cards -->
    <div id="facility-list" class="space-y-3">
      <div class="text-center py-8 text-slate-500 text-sm">Loading directory...</div>
    </div>

  </div>

  <script>
    let facilities = [];
    let currentTier = 'ALL';
    let currentZone = 'ALL';

    fetch('data/facilities.json')
      .then(res => res.json())
      .then(data => {
        facilities = data;
        filterData();
      })
      .catch(() => {
        document.getElementById('facility-list').innerHTML = `
          <div class="text-center py-8 text-red-400 text-sm">Error loading facilities. Ensure data/facilities.json exists.</div>
        `;
      });

    function setTier(tier) {
      currentTier = tier;
      document.querySelectorAll('.tier-tab').forEach(tab => {
        tab.className = 'tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium';
      });
      document.getElementById(`tab-${tier}`).className = 'tier-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap font-medium';
      filterData();
    }

    function setZone(zone) {
      currentZone = zone;
      document.querySelectorAll('.zone-tab').forEach(tab => {
        tab.className = 'zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium';
      });
      document.getElementById(`zone-${zone}`).className = 'zone-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap font-medium';
      filterData();
    }

    function filterData() {
      const q = document.getElementById('search').value.toLowerCase();
      const list = document.getElementById('facility-list');
      list.innerHTML = '';

      const filtered = facilities.filter(f => {
        const matchesTier = (currentTier === 'ALL' || f.tier === currentTier);
        const matchesZone = (currentZone === 'ALL' || f.zone === currentZone);
        const matchesQuery = (f.name && f.name.toLowerCase().includes(q)) || 
                             (f.district && f.district.toLowerCase().includes(q)) || 
                             (f.state && f.state.toLowerCase().includes(q)) ||
                             (f.zone && f.zone.toLowerCase().includes(q)) ||
                             (f.specialties && f.specialties.some(s => s.toLowerCase().includes(q)));
        return matchesTier && matchesZone && matchesQuery;
      });

      document.getElementById('result-count').innerText = `Showing ${filtered.length} facilities`;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">No facilities found for this zone or search query.</div>`;
        return;
      }

      filtered.forEach(f => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2 shadow-sm";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <h3 class="text-sm font-semibold text-slate-100">${f.name}</h3>
              <span class="text-[10px] text-indigo-400 font-medium">${f.zone} Zone • ${f.state}</span>
            </div>
            <span class="text-[10px] bg-slate-800 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-md whitespace-nowrap">${f.tierLabel}</span>
          </div>
          <p class="text-xs text-slate-400">${f.address}</p>
          <div class="flex flex-wrap gap-1 pt-1">
            ${(f.specialties || []).map(s => `<span class="text-[10px] bg-slate-800/90 text-slate-300 px-1.5 py-0.5 rounded">${s}</span>`).join('')}
          </div>
          <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
            <a href="tel:${f.emergency}" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-2.5 py-1 rounded-lg font-medium">
              📞 ${f.emergency}
            </a>
            <span class="text-[11px] text-slate-400">${f.district}</span>
          </div>
        `;
        list.appendChild(card);
      });
    }
  </script>
</body>
</html>
