<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-pital | National ESI Healthcare Locator</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #map { height: 260px; width: 100%; }
    @media (min-width: 768px) { #map { height: 360px; } }
  </style>
</head>
<body class="bg-[#F8F7F4] text-[#1E232A] font-sans min-h-screen pb-12 antialiased">

  <!-- Header -->
  <header class="bg-[#131924] text-white px-4 py-3.5 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 bg-emerald-700 rounded-lg flex items-center justify-center font-black text-white text-base shadow-sm">e</div>
        <div>
          <h1 class="text-base font-bold tracking-tight leading-tight text-[#FAF9F6]">e-pital</h1>
          <p class="text-[10px] text-slate-400">National ESI Facility Directory & Proximity Navigator</p>
        </div>
      </div>
      <div id="stats-counter" class="text-xs bg-[#1C2536] border border-slate-700 px-3 py-1 rounded-full text-emerald-400 font-mono font-medium">
        Loading...
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-3 space-y-3">
    
    <!-- Map Container -->
    <div class="bg-white p-2 rounded-2xl border border-[#E5E2DC] shadow-sm overflow-hidden">
      <div id="map" class="rounded-xl"></div>
    </div>

    <!-- Search Bar -->
    <div class="bg-white p-2.5 rounded-2xl border border-[#E5E2DC] shadow-sm space-y-2 relative">
      <div class="relative flex items-center gap-2">
        <div class="relative flex-1 flex items-center bg-[#F4F2EC] border border-[#DBD7CE] rounded-xl focus-within:ring-2 focus-within:ring-emerald-700 transition">
          <span class="pl-3 text-[#6A7280]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </span>
          <input
            id="location-input"
            type="text"
            autocomplete="off"
            placeholder="Search village, taluk, town, city, or PIN..."
            class="w-full pl-2.5 pr-8 py-2.5 text-sm bg-transparent border-none focus:outline-none font-medium text-[#1E232A] placeholder:text-slate-400"
          />
          <button id="clear-btn" class="hidden absolute right-2.5 text-xs text-slate-400 hover:text-[#1E232A] font-bold px-1">✕</button>
        </div>

        <button id="search-btn" aria-label="Search" class="p-2.5 bg-emerald-800 hover:bg-emerald-900 active:scale-95 text-white rounded-xl shadow-sm shrink-0 transition flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
      </div>

      <div class="flex items-center justify-between text-xs text-[#586171] px-1 pt-0.5">
        <span id="results-count">Showing nearest facilities</span>
        <span id="active-anchor-badge" class="text-[11px] text-emerald-800 font-semibold bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200 hidden"></span>
      </div>
    </div>

    <!-- Facility Cards Container -->
    <div id="facility-list" class="space-y-2.5"></div>

  </main>  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const LOCAL_GEO = {
        "wadi": [17.0483, 76.9934, "Wadi Junction, Kalaburagi"],
        "wadi junction": [17.0483, 76.9934, "Wadi Junction"],
        "gulbarga": [17.3297, 76.8343, "Kalaburagi (Gulbarga)"],
        "kalaburagi": [17.3297, 76.8343, "Kalaburagi"],
        "shahabad": [17.1332, 76.9388, "Shahabad, Kalaburagi"],
        "chittapur": [17.1189, 77.0858, "Chittapur, Kalaburagi"],
        "sedam": [17.1772, 77.2917, "Sedam, Kalaburagi"],
        "aland": [17.5658, 76.5684, "Aland, Kalaburagi"],
        "afzalpur": [17.2023, 76.3562, "Afzalpur, Kalaburagi"],
        "chincholi": [17.4667, 77.4333, "Chincholi, Kalaburagi"],
        "jevargi": [17.0189, 76.7711, "Jevargi, Kalaburagi"],
        "bidar": [17.9104, 77.5199, "Bidar"],
        "raichur": [16.2120, 77.3439, "Raichur"],
        "yadgir": [16.7639, 77.1378, "Yadgir"],
        "hyderabad": [17.3850, 78.4867, "Hyderabad"],
        "warangal": [17.9689, 79.5941, "Warangal"],
        "nizamabad": [18.6725, 78.0941, "Nizamabad"],
        "bengaluru": [12.9716, 77.5946, "Bengaluru"],
        "mumbai": [19.0760, 72.8777, "Mumbai"],
        "delhi": [28.7041, 77.1025, "Delhi"],
        "chennai": [13.0827, 80.2707, "Chennai"],
        "kolkata": [22.5726, 88.3639, "Kolkata"],
        "pune": [18.5204, 73.8567, "Pune"]
      };

      // Map Setup
      const map = L.map('map').setView([17.0483, 76.9934], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      let allFacilities = [];
      let facilityMarkers = [];
      let searchPin = null;

      // Haversine Distance Formula
      function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return parseFloat((R * c).toFixed(1));
      }

      // Fetch Verified Dataset
      try {
        const res = await fetch('./data/facilities.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rawData = await res.json();

        // Standardize schema
        allFacilities = rawData.map(item => ({
          name: item.name,
          lat: item.coordinates ? item.coordinates.lat : item.lat,
          lng: item.coordinates ? item.coordinates.lng : item.lng,
          city: item.address ? (item.address.district || item.address.state) : (item.district || item.state),
          state: item.address ? item.address.state : item.state,
          tier: item.tier || 'PRIMARY',
          phone: item.contact ? item.contact.phone : (item.phone || '')
        }));

        document.getElementById('stats-counter').textContent = `${allFacilities.length} Facilities Live`;

        // Render Map Markers
        allFacilities.forEach(f => {
          const marker = L.marker([f.lat, f.lng])
            .addTo(map)
            .bindPopup(`<b>${f.name}</b><br>${f.city}, ${f.state}`);
          facilityMarkers.push(marker);
        });

      } catch (err) {
        console.error("Data load failed:", err);
        document.getElementById('stats-counter').textContent = 'Offline Mode';
      }
            function renderList(list, anchorLabel) {
        const container = document.getElementById('facility-list');
        container.innerHTML = '';

        const resultsCount = document.getElementById('results-count');
        resultsCount.textContent = anchorLabel ? `Showing nearest to ${anchorLabel}` : 'Showing all facilities';

        const frag = document.createDocumentFragment();
        const cardLimit = Math.min(list.length, 30);

        for (let i = 0; i < cardLimit; i++) {
          const f = list[i];
          const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;
          const distBadge = f.distanceKm !== undefined ? `<span class="text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">📍 ${f.distanceKm} km</span>` : '';

          let badge = "bg-emerald-50 text-emerald-900 border-emerald-200";
          if (f.tier === 'TERTIARY') badge = "bg-rose-50 text-rose-900 border-rose-200";
          else if (f.tier === 'SUPER_SPECIALTY') badge = "bg-purple-50 text-purple-900 border-purple-200";
          else if (f.tier === 'SECONDARY') badge = "bg-amber-50 text-amber-900 border-amber-200";

          const card = document.createElement('div');
          card.className = "p-3.5 bg-white border border-[#E5E2DC] rounded-2xl shadow-sm hover:border-[#DBD7CE] transition relative";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3 pr-10">
              <div>
                <h2 class="text-[13px] font-bold text-[#1E232A] leading-snug cursor-pointer hover:text-emerald-700 transition">${f.name}</h2>
                <p class="text-[11px] text-[#586171] font-medium mt-0.5">${f.city}, ${f.state}</p>
              </div>
            </div>
            <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-[#F4F2EC]">
              <span class="text-[10px] font-mono px-2.5 py-0.5 rounded-full border font-semibold ${badge}">${f.tier}</span>
              ${distBadge}
            </div>
            <a href="${gmaps}" target="_blank" rel="noopener" aria-label="Navigate" title="Open Navigation" class="absolute top-3.5 right-3.5 w-8 h-8 rounded-full bg-[#F4F2EC] hover:bg-emerald-800 text-[#1E232A] hover:text-white flex items-center justify-center transition active:scale-95 shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
              </svg>
            </a>
          `;

          card.querySelector('h2').addEventListener('click', () => {
            map.flyTo([f.lat, f.lng], 13, { duration: 0.8 });
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });

          frag.appendChild(card);
        }
        container.appendChild(frag);
      }

      function setAnchor(lat, lng, label) {
        const badge = document.getElementById('active-anchor-badge');
        badge.textContent = `📍 Nearest to: ${label}`;
        badge.classList.remove('hidden');
        document.getElementById('clear-btn').classList.remove('hidden');

        if (searchPin) map.removeLayer(searchPin);
        searchPin = L.marker([lat, lng], {
          icon: L.divIcon({
            className: 'pin',
            html: `<div class="w-6 h-6 bg-emerald-800 text-white rounded-full border-2 border-white flex items-center justify-center text-xs shadow-md font-bold">📍</div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 24]
          })
        }).addTo(map);

        map.flyTo([lat, lng], 10, { duration: 0.8 });

        const sorted = allFacilities.map(f => ({
          ...f,
          distanceKm: haversine(lat, lng, f.lat, f.lng)
        })).sort((a, b) => a.distanceKm - b.distanceKm);

        renderList(sorted, label);
      }

      async function doSearch(query) {
        const q = query.trim().toLowerCase();
        if (!q) return;

        if (LOCAL_GEO[q]) {
          const hit = LOCAL_GEO[q];
          setAnchor(hit[0], hit[1], hit[2]);
          return;
        }

        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&limit=1&q=${encodeURIComponent(q)}`);
          const data = await res.json();
          if (data && data.length > 0) {
            setAnchor(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name.split(',')[0]);
            return;
          }
        } catch (e) {}

        const filtered = allFacilities.filter(f => f.city.toLowerCase().includes(q) || f.state.toLowerCase().includes(q) || f.name.toLowerCase().includes(q));
        if (filtered.length > 0) {
          setAnchor(filtered[0].lat, filtered[0].lng, filtered[0].city);
        }
      }

      document.getElementById('search-btn').addEventListener('click', () => doSearch(document.getElementById('location-input').value));
      document.getElementById('location-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(e.target.value); });
      document.getElementById('clear-btn').addEventListener('click', () => {
        document.getElementById('location-input').value = '';
        document.getElementById('clear-btn').classList.add('hidden');
        document.getElementById('active-anchor-badge').classList.add('hidden');
        if (searchPin) map.removeLayer(searchPin);
        setAnchor(17.0483, 76.9934, "Wadi Junction");
      });

      // Default Initialization
      setAnchor(17.0483, 76.9934, "Wadi Junction");
      setTimeout(() => map.invalidateSize(), 200);
    });
  </script>
</body>
</html>
