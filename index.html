  <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">E-pital</h1>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">Sec 59(1) Active</span>
      </div>
      <p class="text-xs text-slate-400 mt-1">Pan-India ESIC, ESIS & Empanelled SST Directory</p>
    </header>

    <!-- Search Input -->
    <div>
      <input 
        id="search"
        type="text" 
        placeholder="Search hospital, district, state, specialty..." 
        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500"
        oninput="filterData()"
      />
    </div>

    <!-- Zone Filter Pills -->
    <div>
      <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold px-1">Zones</span>
      <div class="flex gap-2 overflow-x-auto pb-1 mt-1 text-xs">
        <button onclick="setZone('ALL')" id="zone-ALL" class="zone-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">All Zones</button>
        <button onclick="setZone('South')" id="zone-South" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">South</button>
        <button onclick="setZone('North')" id="zone-North" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">North</button>
        <button onclick="setZone('West')" id="zone-West" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">West</button>
        <button onclick="setZone('East')" id="zone-East" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">East</button>
        <button onclick="setZone('Central India')" id="zone-Central India" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Central</button>
        <button onclick="setZone('North East')" id="zone-North East" class="zone-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">North East</button>
      </div>
    </div>

    <!-- Tier Filter Tabs -->
    <div>
      <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold px-1">Facility Tiers</span>
      <div class="flex gap-2 overflow-x-auto pb-1 mt-1 text-xs">
        <button onclick="setTier('ALL')" id="tab-ALL" class="tier-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">All Tiers</button>
        <button onclick="setTier('TIER_1')" id="tab-TIER_1" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Tier 1 • Dispensaries</button>
        <button onclick="setTier('TIER_3')" id="tab-TIER_3" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Tier 3 • Apex / ESIC</button>
        <button onclick="setTier('TIER_4')" id="tab-TIER_4" class="tier-tab bg-slate-900 text-slate-400 border border-slate-800 px-3 py-1.5 rounded-lg whitespace-nowrap font-medium">Tier 4 • Empanelled SST</button>
      </div>
    </div>

    <!-- Live Counter -->
    <div id="result-count" class="text-xs text-slate-400 px-1 font-medium"></div>

    <!-- Facility Cards Container -->
    <div id="facility-list" class="space-y-3"></div>
